    post:
      tags: [Admin Compliance]
      summary: Confirm a violation and apply an action
      description: |
        Requires `violation.action.apply`. Suspension and deactivation are only ever applied here,
        never automatically.
      parameters: [{ $ref: '#/components/parameters/ViolationIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { $ref: '#/components/schemas/ViolationActionType' }
                until: { type: string, format: date-time, nullable: true }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Violation' }

