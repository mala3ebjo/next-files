  # ==========================================================================
  # ADMIN — PRICING
  # ==========================================================================

  /admin/rate-cards:
    get:
      tags: [Admin Pricing]
      summary: List rate card versions
      parameters:
        - $ref: '#/components/parameters/CountryQuery'
        - name: activeOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RateCard' }
    post:
      tags: [Admin Pricing]
      summary: Create a new draft rate card version
      description: |
        Requires `pricing.factor.manage`. Editing never mutates a published version.
        Optionally clone factors from an existing version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateCardBody' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RateCard' }

  /admin/rate-cards/{rateCardId}/factors:
    get:
      tags: [Admin Pricing]
      summary: List factors of a rate card
      parameters: [{ $ref: '#/components/parameters/RateCardIdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PricingFactor' }
    put:
      tags: [Admin Pricing]
      summary: Replace the factor set of a draft rate card
      parameters: [{ $ref: '#/components/parameters/RateCardIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factors]
              properties:
                factors:
                  type: array
                  items: { $ref: '#/components/schemas/PricingFactorBody' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PricingFactor' }
        '409':
          description: Rate card is published and cannot be edited. Code `RATE_CARD_PUBLISHED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/rate-cards/{rateCardId}/publish:
    post:
      tags: [Admin Pricing]
      summary: Publish a rate card version
      parameters: [{ $ref: '#/components/parameters/RateCardIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveFrom]
              properties:
                effectiveFrom: { type: string, format: date-time }
                effectiveTo: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RateCard' }

  /admin/rate-cards/{rateCardId}/diff:
    get:
      tags: [Admin Pricing]
      summary: Impact preview against recent orders
      description: Re-prices a sample of recent orders and reports the average change before publishing.
      parameters:
        - $ref: '#/components/parameters/RateCardIdPath'
        - name: sampleSize
          in: query
          schema: { type: integer, format: int32, default: 1000, maximum: 5000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RateCardDiff' }

  /admin/pricing/simulate:
    post:
