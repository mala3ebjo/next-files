# ============================================================================
# COMPONENTS
# ============================================================================

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token, 15 minute TTL. Claims: `sub`, `userKind`, `roles`, `permissions`,
        `orgId`, `countryId`, `tier`, `jti`, `ver`. Raising the user's `ver` invalidates
        every live token immediately.

  parameters:
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      schema: { type: string, example: 1.4.2 }
    AppPlatform:
      name: X-App-Platform
      in: header
      required: false
      schema: { type: string, enum: [android, ios, web] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID. Replaying the same key returns the original result.
      schema: { type: string, format: uuid }
    CountryQuery:
      name: countryCode
      in: query
      required: false
      schema: { type: string, minLength: 2, maxLength: 2, example: IQ }
    Page:
      name: page
      in: query
      schema: { type: integer, format: int32, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: q
      in: query
      schema: { type: string, maxLength: 120 }
    FromDate:
      name: from
      in: query
      schema: { type: string, format: date-time }
    ToDate:
      name: to
      in: query
      schema: { type: string, format: date-time }
    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    StopIdPath:
      name: stopId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    OfferIdPath:
      name: offerId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ApplicationIdPath:
      name: applicationId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AddressIdPath:
      name: addressId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    DriverIdPath:
      name: driverId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    VehicleIdPath:
      name: vehicleId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CarrierIdPath:
      name: carrierId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ViolationIdPath:
      name: violationId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RateCardIdPath:
      name: rateCardId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CorridorIdPath:
      name: corridorId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PayoutIdPath:
      name: payoutId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, expired or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated but not permitted, or outside the caller's organization scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicting state or duplicate resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidState:
      description: The order state machine rejected this transition. Code `INVALID_STATE_TRANSITION`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: File exceeds the configured maximum size
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Rate limited. `Retry-After` indicates when to retry.
      headers:
        Retry-After:
          schema: { type: integer, format: int32 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    OrderOk:
      description: Order returned
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/BaseResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
    ApplicationOk:
      description: Application returned
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/BaseResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ApplicationDetail' }
    ApplicationCreated:
      description: Application created
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/BaseResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ApplicationDetail' }

  schemas:

    # ---------------------------------------------------------------- envelope
    BaseResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, example: true }
        error:
          allOf: [{ $ref: '#/components/schemas/ApiError' }]
          nullable: true
    PagedResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            meta: { $ref: '#/components/schemas/PageMeta' }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error: { $ref: '#/components/schemas/ApiError' }
    ApiError:
      type: object
      required: [code, messageKey]
      description: |
        The server never returns translated text. The client renders `messageKey` with `params`
        using the active language bundle.
      properties:
        code:
          type: string
          example: ORDER_WEIGHT_EXCEEDS_CAPACITY
          description: Stable machine code. Never changed once released.
        messageKey:
          type: string
          example: error.order.weight_exceeds
        params:
          type: object
          additionalProperties: true
          nullable: true
        fieldErrors:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field: { type: string }
              messageKey: { type: string }
              params:
                type: object
                additionalProperties: true
    PageMeta:
      type: object
      properties:
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }
        total: { type: integer, format: int64 }
        totalPages: { type: integer, format: int32 }

    # ------------------------------------------------------------ shared value
    Money:
      type: object
      required: [amountMinor, currency]
      description: Integer minor units plus currency. Never a floating point value.
      properties:
        amountMinor: { type: integer, format: int64, example: 250000 }
        currency: { type: string, minLength: 3, maxLength: 3, example: IQD }
        decimalDigits: { type: integer, format: int32, example: 0 }
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double, example: 33.3152 }
        lng: { type: number, format: double, example: 44.3661 }
    GeoReport:
      allOf:
        - $ref: '#/components/schemas/GeoPoint'
        - type: object
          properties:
            accuracy: { type: number, format: double }
            recordedAt: { type: string, format: date-time }
            mocked: { type: boolean, default: false }
    LocationPoint:
      allOf:
        - $ref: '#/components/schemas/GeoPoint'
        - type: object
          required: [recordedAt]
          properties:
            speed: { type: number, format: double, nullable: true }
            heading: { type: number, format: double, nullable: true }
            accuracy: { type: number, format: double, nullable: true }
            batteryLevel: { type: integer, format: int32, nullable: true }
            mocked: { type: boolean, default: false }
            orderId: { type: integer, format: int64, nullable: true }
            recordedAt: { type: string, format: date-time }
    DocumentRef:
      type: object
      properties:
        id: { type: integer, format: int64 }
        docType: { type: string }
        url: { type: string, format: uri, description: Short-lived signed URL. }
        expiryDate: { type: string, format: date, nullable: true }
        verifyStatus: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        uploadedAt: { type: string, format: date-time }
    MediaRef:
      type: object
      properties:
        mediaId: { type: string }
        url: { type: string, format: uri }
        type: { type: string, enum: [IMAGE, VOICE] }
        durationSeconds: { type: integer, format: int32, nullable: true }
        sizeBytes: { type: integer, format: int64 }

    # ------------------------------------------------------------------- enums
    UserKind:
      type: string
      enum: [CLIENT, DRIVER, FLEET, BROKER, STAFF]
    ClientType:
      type: string
      enum: [INDIVIDUAL, COMPANY]
    CarrierType:
      type: string
      enum: [INDIVIDUAL_DRIVER, FLEET_COMPANY, BROKER_COMPANY]
    CarrierStatus:
      type: string
      enum: [PENDING_REVIEW, CHANGES_REQUESTED, ACTIVE, SUSPENDED, DEACTIVATED, REJECTED]
    ApplicationStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, CHANGES_REQUESTED, APPROVED, REJECTED]
    OrderStatus:
      type: string
      enum:
        - DRAFT
        - QUOTED
        - AWAITING_PAYMENT
        - PAYMENT_FAILED
        - SEARCHING
        - UNFULFILLED
        - ASSIGNED
        - REASSIGNING
        - DRIVER_EN_ROUTE_PICKUP
        - AT_PICKUP
        - LOADED
        - IN_TRANSIT
        - AT_STOP
        - AT_BORDER
        - CUSTOMS_CLEARANCE
        - HELD_AT_BORDER
        - AT_DROPOFF
        - DELIVERED
        - COD_PENDING
        - COMPLETED
        - RATED
        - CANCELLED
        - DISPUTED
    StopType:
      type: string
      enum: [PICKUP, STOP, DROPOFF]
    PayerType:
      type: string
      enum: [SENDER, RECEIVER]
    PaymentMethod:
      type: string
      enum: [CARD, WALLET, COD, APPLE_PAY, GOOGLE_PAY, ZAINCASH, CLIQ, STC_PAY]
    PaymentStatus:
      type: string
      enum: [PENDING, AUTHORIZED, CAPTURED, FAILED, REFUNDED, PARTIALLY_REFUNDED]
    PayoutStatus:
      type: string
      enum: [REQUESTED, APPROVED, PROCESSING, PAID, REJECTED, FAILED]
    CodStatus:
      type: string
      enum: [HELD, SUBMITTED, SETTLED, OVERDUE]
    CodSettleMethod:
      type: string
      enum: [BANK_DEPOSIT, OFFICE_HANDOVER, PAYOUT_DEDUCTION]
    OfferStatus:
      type: string
      enum: [SENT, ACCEPTED, REJECTED, EXPIRED, CANCELLED]
    ViolationStatus:
      type: string
      enum: [OPEN, CONFIRMED, DISMISSED, EXPIRED, APPEALED]
    ViolationSeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    ViolationActionType:
      type: string
      description: |
        WARNING and PRIORITY_DROP are applied automatically. PAYOUT_HOLD is automatic but
        flagged for review. SUSPENSION and DEACTIVATION require an explicit admin action.
      enum: [WARNING, PRIORITY_DROP, PAYOUT_HOLD, SUSPENSION, DEACTIVATION, NONE]
    MessageType:
      type: string
      enum: [TEXT, IMAGE, VOICE, SYSTEM]
    SubscriptionStatus:
      type: string
      enum: [ACTIVE, PENDING_PAYMENT, PAST_DUE, CANCELLED, EXPIRED]
    DocumentType:
      type: string
      enum:
        - NATIONAL_ID
        - DRIVING_LICENCE
        - PASSPORT
        - VEHICLE_LICENCE
        - VEHICLE_PHOTO
        - VEHICLE_INSURANCE
        - TECHNICAL_INSPECTION
        - CROSS_BORDER_PERMIT
        - COMPANY_REGISTRATION
        - TAX_CERTIFICATE
        - BROKERAGE_LICENCE
        - TRANSPORT_LICENCE
        - OTHER
    CustomsDocumentType:
      type: string
      enum:
        - COMMERCIAL_INVOICE
        - PACKING_LIST
        - CARGO_MANIFEST
        - CERTIFICATE_OF_ORIGIN
        - TIR_CARNET
        - VETERINARY_CERTIFICATE
        - HEALTH_CERTIFICATE
        - DANGEROUS_GOODS_DECLARATION
        - TRANSIT_PERMIT
        - OTHER

    # ----------------------------------------------------------------- catalog
    Bootstrap:
      type: object
      properties:
        serverTime: { type: string, format: date-time }
        countries:
          type: array
          items: { $ref: '#/components/schemas/Country' }
        languages:
          type: array
          items: { $ref: '#/components/schemas/Language' }
        defaultLanguageCode: { type: string, example: en }
        featureFlags:
          type: object
          additionalProperties: { type: boolean }
        minSupportedAppVersion: { type: string, example: 1.2.0 }
        latestAppVersion: { type: string, example: 1.4.2 }
        forceUpdate: { type: boolean }
        supportPhone: { type: string, nullable: true }
        legalUrls:
          type: object
          additionalProperties: { type: string, format: uri }
    Country:
      type: object
      properties:
        id: { type: integer, format: int64 }
        isoCode: { type: string, example: IQ }
        nameKey: { type: string, example: country.iq }
        phoneCode: { type: string, example: "+964" }
        phonePattern: { type: string, example: "^7[0-9]{9}$" }
        currency: { $ref: '#/components/schemas/Currency' }
        defaultTimezone: { type: string, example: Asia/Baghdad }
        defaultLanguageCode: { type: string, example: ar }
        codEnabled: { type: boolean }
        allowedPaymentMethods:
          type: array
          items: { $ref: '#/components/schemas/PaymentMethod' }
        allowedPayoutMethods:
          type: array
          items: { $ref: '#/components/schemas/PayoutMethodDef' }
        isActive: { type: boolean }
    CountryAdmin:
      allOf:
        - $ref: '#/components/schemas/Country'
        - type: object
          properties:
            commissionPercent: { type: number, format: double }
            cancellationFeePercent: { type: number, format: double }
            vatPercent: { type: number, format: double }
            taxInclusive: { type: boolean }
            codCashLimitMinor: { type: integer, format: int64 }
            minPayoutMinor: { type: integer, format: int64 }
            payoutHoldHours: { type: integer, format: int32 }
            dispatchRadiiKm:
              type: array
              items: { type: number, format: double }
            offerTtlSeconds: { type: integer, format: int32 }
            maxDispatchRounds: { type: integer, format: int32 }
    CountryBody:
      type: object
      required: [isoCode, currencyCode, phoneCode]
      properties:
        isoCode: { type: string, minLength: 2, maxLength: 2 }
        nameKey: { type: string }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        phoneCode: { type: string }
        phonePattern: { type: string }
        defaultTimezone: { type: string }
        defaultLanguageCode: { type: string }
        codEnabled: { type: boolean, default: false }
        isActive: { type: boolean, default: false }
        allowedPaymentMethods:
          type: array
          items: { $ref: '#/components/schemas/PaymentMethod' }
        allowedPayoutMethodCodes:
          type: array
          items: { type: string }
        commissionPercent: { type: number, format: double }
        cancellationFeePercent: { type: number, format: double }
        vatPercent: { type: number, format: double }
        taxInclusive: { type: boolean }
        codCashLimitMinor: { type: integer, format: int64 }
        minPayoutMinor: { type: integer, format: int64 }
        payoutHoldHours: { type: integer, format: int32 }
        dispatchRadiiKm:
          type: array
          items: { type: number, format: double }
        offerTtlSeconds: { type: integer, format: int32 }
        maxDispatchRounds: { type: integer, format: int32 }
    Currency:
      type: object
      properties:
        code: { type: string, example: IQD }
        symbol: { type: string, example: "د.ع" }
        decimalDigits: { type: integer, format: int32, example: 0 }
        symbolPosition: { type: string, enum: [PREFIX, SUFFIX] }
    FxRate:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fromCurrency: { type: string }
        toCurrency: { type: string }
        rate: { type: number, format: double }
        platformMarginPercent: { type: number, format: double }
        effectiveFrom: { type: string, format: date-time }
    FxRateBody:
      type: object
      required: [fromCurrency, toCurrency, rate]
      properties:
        fromCurrency: { type: string, minLength: 3, maxLength: 3 }
        toCurrency: { type: string, minLength: 3, maxLength: 3 }
        rate: { type: number, format: double }
        platformMarginPercent: { type: number, format: double, default: 0 }
        effectiveFrom: { type: string, format: date-time }
    PayoutMethodDef:
      type: object
      description: Country-scoped payout rail definition. Adding a rail is configuration, not code.
      properties:
        code: { type: string, example: ZAINCASH }
        nameKey: { type: string }
        requiredFields:
          type: array
          items:
            type: object
            properties:
              key: { type: string, example: iban }
              labelKey: { type: string }
              pattern: { type: string }
              required: { type: boolean }
        feeMinor: { type: integer, format: int64 }
        processingHours: { type: integer, format: int32 }
    Language:
      type: object
      properties:
        code: { type: string, example: ar }
        nativeName: { type: string, example: العربية }
        englishName: { type: string, example: Arabic }
        direction: { type: string, enum: [ltr, rtl] }
        isActive: { type: boolean }
        bundleVersion: { type: integer, format: int32 }
    LanguageBody:
      type: object
      required: [code, direction]
      properties:
        code: { type: string }
        nativeName: { type: string }
        englishName: { type: string }
        direction: { type: string, enum: [ltr, rtl] }
        isActive: { type: boolean, default: true }
    TranslationBundle:
      type: object
      properties:
        languageCode: { type: string }
        direction: { type: string, enum: [ltr, rtl] }
        version: { type: integer, format: int32 }
        isDelta: { type: boolean }
        entries:
          type: object
          additionalProperties: { type: string }
          example:
            error.order.weight_exceeds: "Weight exceeds the selected truck capacity"
            order.status.in_transit: "In transit"
        removedKeys:
          type: array
          items: { type: string }
    TranslationEntry:
      type: object
      required: [languageCode, namespace, key, value]
      properties:
        languageCode: { type: string }
        namespace: { type: string, example: order }
        key: { type: string, example: order.status.in_transit }
        value: { type: string }
    VehicleType:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: BOX_TRUCK }
        nameKey: { type: string }
        descriptionKey: { type: string, nullable: true }
        maxCapacityKg: { type: integer, format: int32, example: 10000 }
        iconKey: { type: string }
        imageUrl: { type: string, format: uri, nullable: true }
        refrigerated: { type: boolean }
        distanceBandKey: { type: string, nullable: true, example: SHORT }
        isActive: { type: boolean }
    VehicleTypeBody:
      type: object
      required: [code, maxCapacityKg]
      properties:
        code: { type: string }
        nameKey: { type: string }
        maxCapacityKg: { type: integer, format: int32 }
        iconKey: { type: string }
        refrigerated: { type: boolean, default: false }
        distanceBandKey: { type: string, nullable: true }
        isActive: { type: boolean, default: true }
        countryIds:
          type: array
          items: { type: integer, format: int64 }
    CargoType:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: FOODSTUFF }
        nameKey: { type: string }
        iconKey: { type: string }
        restricted: { type: boolean }
        requiresRefrigeration: { type: boolean }
        isActive: { type: boolean }
    CargoTypeBody:
      type: object
      required: [code]
      properties:
        code: { type: string }
        nameKey: { type: string }
        iconKey: { type: string }
        restricted: { type: boolean, default: false }
        requiresRefrigeration: { type: boolean, default: false }
        isActive: { type: boolean, default: true }
    Corridor:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fromCountryCode: { type: string, example: TR }
        toCountryCode: { type: string, example: IQ }
        crossing: { $ref: '#/components/schemas/BorderCrossing' }
        nameKey: { type: string }
        isActive: { type: boolean }
        requiredDocuments:
          type: array
          items:
            type: object
            properties:
              docType: { $ref: '#/components/schemas/CustomsDocumentType' }
              mandatory: { type: boolean }
    CorridorBody:
      type: object
      required: [fromCountryCode, toCountryCode, crossingId]
      properties:
        fromCountryCode: { type: string }
        toCountryCode: { type: string }
        crossingId: { type: integer, format: int64 }
        nameKey: { type: string }
        isActive: { type: boolean, default: true }
    BorderCrossing:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nameKey: { type: string, example: crossing.habur_ibrahim_khalil }
        location: { $ref: '#/components/schemas/GeoPoint' }
        countryACode: { type: string }
        countryBCode: { type: string }

    # -------------------------------------------------------------------- auth
    OtpRequestBody:
      type: object
      required: [phone, countryCode]
      properties:
        phone: { type: string, example: "7701234567" }
        countryCode: { type: string, minLength: 2, maxLength: 2, example: IQ }
        purpose:
          type: string
          enum: [LOGIN, REGISTRATION, PHONE_CHANGE]
          default: LOGIN
    OtpChallenge:
      type: object
      properties:
        requestId: { type: string, format: uuid }
        expiresInSeconds: { type: integer, format: int32, example: 120 }
        resendAfterSeconds: { type: integer, format: int32, example: 60 }
        codeLength: { type: integer, format: int32, example: 6 }
        maskedPhone: { type: string, example: "+964 77* *** 4567" }
    OtpVerifyBody:
      type: object
      required: [requestId, code]
      properties:
        requestId: { type: string, format: uuid }
        code: { type: string, example: "482913" }
        deviceId: { type: string }
        devicePlatform: { type: string, enum: [android, ios, web] }
        fcmToken: { type: string, nullable: true }
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessTokenExpiresIn: { type: integer, format: int32, example: 900 }
        refreshTokenExpiresIn: { type: integer, format: int32, example: 5184000 }
        tokenScope:
          type: string
          enum: [FULL, LIMITED]
          description: |
            LIMITED is issued to carriers whose account is not approved. It permits only
            application status, resubmission, document upload, support and appeals.
    AuthSession:
      type: object
      properties:
        tokens: { $ref: '#/components/schemas/TokenPair' }
        authContext: { $ref: '#/components/schemas/AuthContext' }
        profile:
          allOf: [{ $ref: '#/components/schemas/Me' }]
          nullable: true
    AuthContext:
      type: object
      properties:
        userKind: { $ref: '#/components/schemas/UserKind' }
        status:
          type: string
          enum: [ACTIVE, PROFILE_INCOMPLETE, PENDING_REVIEW, CHANGES_REQUESTED, REJECTED, SUSPENDED, DEACTIVATED]
        nextScreen:
          type: string
          enum: [HOME, COMPLETE_PROFILE, WAITING_APPROVAL, FIX_AND_RESUBMIT, REJECTED, SUSPENDED]
        applicationId: { type: integer, format: int64, nullable: true }
        reasonKeys:
          type: array
          items: { type: string }
        suspendedUntil: { type: string, format: date-time, nullable: true }
        appealAvailable: { type: boolean, default: false }
    SessionInfo:
      type: object
      properties:
        sessionId: { type: string }
        deviceId: { type: string }
        platform: { type: string }
        appVersion: { type: string }
        ipAddress: { type: string }
        lastSeenAt: { type: string, format: date-time }
        current: { type: boolean }
    CpLoginResult:
      type: object
      properties:
        requires2fa: { type: boolean }
        partialToken: { type: string, nullable: true }
        session:
          allOf: [{ $ref: '#/components/schemas/AuthSession' }]
          nullable: true

    # ----------------------------------------------------------------- profile
    Me:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        userKind: { $ref: '#/components/schemas/UserKind' }
        phone: { type: string }
        email: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        avatarUrl: { type: string, format: uri, nullable: true }
        countryCode: { type: string }
        preferredLanguageCode: { type: string }
        displayCurrency: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        organization:
          allOf: [{ $ref: '#/components/schemas/OrganizationBrief' }]
          nullable: true
        clientProfile:
          allOf: [{ $ref: '#/components/schemas/ClientProfile' }]
          nullable: true
        carrierProfile:
          allOf: [{ $ref: '#/components/schemas/CarrierProfile' }]
          nullable: true
        createdAt: { type: string, format: date-time }
    MeUpdateBody:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: string, format: uri }
        preferredLanguageCode: { type: string }
        displayCurrency: { type: string }
    OrganizationBrief:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orgType: { type: string, enum: [FLEET, BROKER, CLIENT_COMPANY] }
        legalName: { type: string }
        tradeName: { type: string, nullable: true }
        countryCode: { type: string }
        status: { type: string }
    ClientProfile:
      type: object
      properties:
        clientType: { $ref: '#/components/schemas/ClientType' }
        ratingAvg: { type: number, format: double, nullable: true }
        subscription:
          allOf: [{ $ref: '#/components/schemas/Subscription' }]
          nullable: true
        savedAddressCount: { type: integer, format: int32 }
    CarrierProfile:
      type: object
      properties:
        carrierId: { type: integer, format: int64 }
        carrierType: { $ref: '#/components/schemas/CarrierType' }
        status: { $ref: '#/components/schemas/CarrierStatus' }
        tier: { $ref: '#/components/schemas/CarrierTier' }
        ratingAvg: { type: number, format: double, nullable: true }
        completedOrders: { type: integer, format: int32 }
        violationPoints: { type: integer, format: int32 }
        isAvailable: { type: boolean }
        activeRestrictions:
          type: array
          items: { $ref: '#/components/schemas/ViolationActionType' }
        codHeld: { $ref: '#/components/schemas/Money' }

    # ------------------------------------------------------------ registration
    ClientRegistrationBody:
      type: object
      required: [clientType, firstName]
      properties:
        clientType: { $ref: '#/components/schemas/ClientType' }
        firstName: { type: string, maxLength: 60 }
        lastName: { type: string, maxLength: 60 }
        email: { type: string, format: email, nullable: true }
        countryCode: { type: string }
        preferredLanguageCode: { type: string, nullable: true }
        company:
          allOf: [{ $ref: '#/components/schemas/CompanyInfoBody' }]
          nullable: true
        planId:
          type: integer
          format: int64
          nullable: true
          description: Optional. Omitting it assigns the Free plan.
        acceptedTerms: { type: boolean }
    CompanyInfoBody:
      type: object
      required: [legalName, address]
      properties:
        legalName: { type: string, maxLength: 160 }
        tradeName: { type: string, nullable: true }
        address: { type: string, maxLength: 300 }
        taxNumber: { type: string, nullable: true }
        responsiblePersonName: { type: string }
        email: { type: string, format: email, nullable: true }
    DriverApplicationBody:
      type: object
      required: [personal, vehicle, countryCode]
      properties:
        countryCode: { type: string }
        personal: { $ref: '#/components/schemas/PersonalInfoBody' }
        vehicle: { $ref: '#/components/schemas/VehicleBody' }
        crossBorderRequested: { type: boolean, default: false }
        acceptedTerms: { type: boolean }
    FleetApplicationBody:
      type: object
      required: [company, countryCode, declaredVehicleCount]
      properties:
        countryCode: { type: string }
        company: { $ref: '#/components/schemas/CompanyInfoBody' }
        responsible: { $ref: '#/components/schemas/PersonalInfoBody' }
        declaredVehicleCount: { type: integer, format: int32, minimum: 1 }
        vehicles:
          type: array
          items: { $ref: '#/components/schemas/VehicleBody' }
        acceptedTerms: { type: boolean }
    BrokerApplicationBody:
      type: object
      required: [company, countryCode]
      properties:
        countryCode: { type: string }
        company: { $ref: '#/components/schemas/CompanyInfoBody' }
        responsible: { $ref: '#/components/schemas/PersonalInfoBody' }
        acceptedTerms: { type: boolean }
    PersonalInfoBody:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, maxLength: 60 }
        middleName: { type: string, maxLength: 60, nullable: true }
        lastName: { type: string, maxLength: 60 }
        nationalId: { type: string, nullable: true }
        licenceNumber: { type: string, nullable: true }
        licenceExpiry: { type: string, format: date, nullable: true }
        passportNumber: { type: string, nullable: true }
        passportExpiry: { type: string, format: date, nullable: true }
        email: { type: string, format: email, nullable: true }
    ApplicationSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/CarrierType' }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        displayName: { type: string }
        phone: { type: string }
        countryCode: { type: string }
        vehicleCount: { type: integer, format: int32 }
        submittedAt: { type: string, format: date-time, nullable: true }
        hasDuplicateWarnings: { type: boolean }
    ApplicationDetail:
      allOf:
        - $ref: '#/components/schemas/ApplicationSummary'
        - type: object
          properties:
            currentStep: { type: integer, format: int32 }
            totalSteps: { type: integer, format: int32 }
            personal:
              allOf: [{ $ref: '#/components/schemas/PersonalInfoBody' }]
              nullable: true
            company:
              allOf: [{ $ref: '#/components/schemas/CompanyInfoBody' }]
              nullable: true
            vehicles:
              type: array
              items: { $ref: '#/components/schemas/VehicleBody' }
            documents:
              type: array
              items: { $ref: '#/components/schemas/DocumentRef' }
            reasonKeys:
              type: array
              items: { type: string }
            fieldNotes:
              type: array
              items: { $ref: '#/components/schemas/FieldNote' }
            duplicateWarnings:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: plateNumber }
                  value: { type: string }
                  existingEntity: { type: string }
                  existingId: { type: integer, format: int64 }
            reviewedBy: { type: integer, format: int64, nullable: true }
            reviewedAt: { type: string, format: date-time, nullable: true }
            activationEtaHours: { type: integer, format: int32, example: 24 }
    FieldNote:
      type: object
      properties:
        field: { type: string, example: vehicle.insurance }
        messageKey: { type: string }
        note: { type: string, nullable: true }

    # ---------------------------------------------------------------- addresses
    SavedAddress:
      type: object
      properties:
        id: { type: integer, format: int64 }
        label: { type: string, example: Warehouse }
        addressLine: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        countryCode: { type: string }
        city: { type: string, nullable: true }
        contactName: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        note: { type: string, nullable: true }
        isDefault: { type: boolean }
    SavedAddressBody:
      type: object
      required: [label, addressLine, location]
      properties:
        label: { type: string, maxLength: 60 }
        addressLine: { type: string, maxLength: 300 }
        location: { $ref: '#/components/schemas/GeoPoint' }
        city: { type: string, nullable: true }
        contactName: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        note: { type: string, maxLength: 500, nullable: true }
        isDefault: { type: boolean, default: false }

    # ------------------------------------------------------------------ orders
    QuoteRequest:
      type: object
      required: [stops, vehicleTypeId, cargo]
      properties:
        vehicleTypeId: { type: integer, format: int64 }
        cargo: { $ref: '#/components/schemas/CargoBody' }
        stops:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/StopBody' }
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: Omit for ASAP.
        promoCode: { type: string, nullable: true }
        displayCurrency: { type: string, nullable: true }
    StopBody:
      type: object
      required: [stopType, addressLine, location]
      properties:
        stopType: { $ref: '#/components/schemas/StopType' }
        sequence: { type: integer, format: int32 }
        addressLine: { type: string, maxLength: 300 }
        location: { $ref: '#/components/schemas/GeoPoint' }
        contactName: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        note: { type: string, maxLength: 500, nullable: true }
    CargoBody:
      type: object
      required: [cargoTypeId, weightKg]
      properties:
        cargoTypeId: { type: integer, format: int64 }
        weightKg: { type: integer, format: int32, minimum: 1 }
        dimensions: { type: string, nullable: true }
        description: { type: string, maxLength: 500, nullable: true }
        fragile: { type: boolean, default: false }
        requiresRefrigeration: { type: boolean, default: false }
        declaredValueMinor: { type: integer, format: int64, nullable: true }
    Quote:
      type: object
      properties:
        quoteId: { type: integer, format: int64 }
        breakdown: { $ref: '#/components/schemas/PriceBreakdown' }
        expiresAt: { type: string, format: date-time }
        distanceKm: { type: number, format: double }
        estimatedDurationMinutes: { type: integer, format: int32 }
        isCrossBorder: { type: boolean }
        routePolyline: { type: string, nullable: true }
    PriceBreakdown:
      type: object
      description: Immutable snapshot. The same structure is shown in the app, the CP and the invoice.
      properties:
        total: { $ref: '#/components/schemas/Money' }
        subtotal: { $ref: '#/components/schemas/Money' }
        taxAmount: { $ref: '#/components/schemas/Money' }
        settlementCurrency:
          type: string
          description: Always the pickup country currency.
        displayCurrency: { type: string }
        fxRate: { type: number, format: double, nullable: true }
        rateCardVersion: { type: integer, format: int32 }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PriceLine' }
        legs:
          type: array
          items: { $ref: '#/components/schemas/PriceLeg' }
        minFareApplied: { type: boolean }
        discounts:
          type: array
          items: { $ref: '#/components/schemas/PriceLine' }
    PriceLine:
      type: object
      properties:
        factorGroup: { type: string, example: DISTANCE }
        factorKey: { type: string, example: rate_per_km }
        labelKey: { type: string }
        calcType: { type: string, enum: [FIXED, PER_UNIT, PERCENT, MULTIPLIER] }
        inputValue: { type: number, format: double, nullable: true }
        factorValue: { type: number, format: double }
        amount: { $ref: '#/components/schemas/Money' }
    PriceLeg:
      type: object
      properties:
        sequence: { type: integer, format: int32 }
        fromCountryCode: { type: string }
        toCountryCode: { type: string }
        corridorId: { type: integer, format: int64, nullable: true }
        crossingNameKey: { type: string, nullable: true }
        distanceKm: { type: number, format: double }
        amount: { $ref: '#/components/schemas/Money' }
        corridorFees:
          type: array
          items: { $ref: '#/components/schemas/PriceLine' }
    OrderCreateBody:
      type: object
      required: [quoteId, payer]
      properties:
        quoteId: { type: integer, format: int64 }
        payer: { $ref: '#/components/schemas/PayerType' }
        note: { type: string, maxLength: 500, nullable: true }
        acceptedCancellationPolicy: { type: boolean }
    Order:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: NF-72-BGW-BSR }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusKey: { type: string, example: order.status.in_transit }
        payer: { $ref: '#/components/schemas/PayerType' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        isCrossBorder: { type: boolean }
        isScheduled: { type: boolean }
        scheduledAt: { type: string, format: date-time, nullable: true }
        price: { $ref: '#/components/schemas/PriceBreakdown' }
        distanceKm: { type: number, format: double }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        cargo: { $ref: '#/components/schemas/CargoBody' }
        stops:
          type: array
          items: { $ref: '#/components/schemas/OrderStop' }
        legs:
          type: array
          items: { $ref: '#/components/schemas/OrderLeg' }
        driver:
          allOf: [{ $ref: '#/components/schemas/DriverBrief' }]
          nullable: true
        vehicle:
          allOf: [{ $ref: '#/components/schemas/VehicleBrief' }]
          nullable: true
        client:
          allOf: [{ $ref: '#/components/schemas/ClientBrief' }]
          nullable: true
        timeline:
          type: array
          items: { $ref: '#/components/schemas/OrderTimelineEntry' }
        proofs:
          type: array
          items: { $ref: '#/components/schemas/OrderProof' }
        conversationId: { type: integer, format: int64, nullable: true }
        trackingToken: { type: string, nullable: true }
        canCancel: { type: boolean }
        cancellationFeePreview:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    OrderSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusKey: { type: string }
        routeLabel: { type: string, example: Baghdad - Basrah }
        vehicleTypeNameKey: { type: string }
        distanceBandKey: { type: string, nullable: true }
        total: { $ref: '#/components/schemas/Money' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        isCrossBorder: { type: boolean }
        scheduledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    OrderStop:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sequence: { type: integer, format: int32 }
        stopType: { $ref: '#/components/schemas/StopType' }
        addressLine: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        countryCode: { type: string }
        contactName: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        note: { type: string, nullable: true }
        eta: { type: string, format: date-time, nullable: true }
        arrivedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        verificationCodeRequired: { type: boolean }
    OrderLeg:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sequence: { type: integer, format: int32 }
        fromCountryCode: { type: string }
        toCountryCode: { type: string }
        corridorId: { type: integer, format: int64, nullable: true }
        crossingNameKey: { type: string, nullable: true }
        distanceKm: { type: number, format: double }
        status: { type: string, enum: [PENDING, ACTIVE, AT_BORDER, CLEARED, COMPLETED, HELD] }
        borderEnteredAt: { type: string, format: date-time, nullable: true }
        borderClearedAt: { type: string, format: date-time, nullable: true }
        requiredDocuments:
          type: array
          items:
            type: object
            properties:
              docType: { $ref: '#/components/schemas/CustomsDocumentType' }
              mandatory: { type: boolean }
              uploaded: { type: boolean }
              verifyStatus: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
    OrderTimelineEntry:
      type: object
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        labelKey: { type: string }
        occurredAt: { type: string, format: date-time }
        actorType: { type: string, enum: [CLIENT, DRIVER, CARRIER, ADMIN, SYSTEM] }
        note: { type: string, nullable: true }
    OrderProof:
      type: object
      properties:
        id: { type: integer, format: int64 }
        proofType: { type: string, enum: [PICKUP, STOP, DELIVERY, HANDOVER] }
        stopId: { type: integer, format: int64, nullable: true }
        photoUrls:
          type: array
          items: { type: string, format: uri }
        signatureUrl: { type: string, format: uri, nullable: true }
        location: { $ref: '#/components/schemas/GeoPoint' }
        geofenceOk: { type: boolean }
        mockLocation: { type: boolean }
        capturedAt: { type: string, format: date-time }
    DriverBrief:
      type: object
      properties:
        driverId: { type: integer, format: int64 }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri, nullable: true }
        phone: { type: string, nullable: true, description: Masked or hidden depending on order state. }
        ratingAvg: { type: number, format: double, nullable: true }
    VehicleBrief:
      type: object
      properties:
        vehicleId: { type: integer, format: int64 }
        vehicleTypeNameKey: { type: string }
        plateNumber: { type: string, description: Masked on public tracking. }
        plateCountry: { type: string }
        color: { type: string, nullable: true }
    ClientBrief:
      type: object
      properties:
        clientId: { type: integer, format: int64 }
        displayName: { type: string }
        clientType: { $ref: '#/components/schemas/ClientType' }
        phone: { type: string, nullable: true }
        ratingAvg: { type: number, format: double, nullable: true }
    CheckoutBody:
      type: object
      required: [method]
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
        returnUrl: { type: string, format: uri, nullable: true }
        savePaymentMethod: { type: boolean, default: false }
    CheckoutResult:
      type: object
      properties:
        paymentId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        requiresAction: { type: boolean }
        checkoutId: { type: string, nullable: true }
        redirectUrl: { type: string, format: uri, nullable: true }
        providerParams:
          type: object
          additionalProperties: true
          nullable: true
        orderStatus:
          allOf: [{ $ref: '#/components/schemas/OrderStatus' }]
          nullable: true
    CancellationResult:
      type: object
      properties:
        orderId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        feeApplied: { $ref: '#/components/schemas/Money' }
        refundAmount: { $ref: '#/components/schemas/Money' }
        refundMethod: { type: string, enum: [ORIGINAL_METHOD, WALLET, NONE] }
        freeCancellationsRemaining: { type: integer, format: int32, nullable: true }
    DriverCancellationResult:
      type: object
      properties:
        orderId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        violationRaised: { type: boolean }
        violationId: { type: integer, format: int64, nullable: true }
        pointsAdded: { type: integer, format: int32 }
    TrackingSnapshot:
      type: object
      properties:
        orderId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        driverLocation:
          allOf: [{ $ref: '#/components/schemas/GeoPoint' }]
          nullable: true
        lastPingAt: { type: string, format: date-time, nullable: true }
        etaToNextStop: { type: string, format: date-time, nullable: true }
        nextStopId: { type: integer, format: int64, nullable: true }
        remainingDistanceKm: { type: number, format: double, nullable: true }
        routePolyline: { type: string, nullable: true }
    TrackingLink:
      type: object
      properties:
        token: { type: string }
        url: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        disabledAt: { type: string, format: date-time, nullable: true }
    PublicTracking:
      type: object
      description: |
        Contains no personal phone numbers and no full street addresses. The link is
        automatically disabled once the order is delivered.
      properties:
        orderCode: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusKey: { type: string }
        pickupCity: { type: string }
        dropoffCity: { type: string }
        vehicleTypeNameKey: { type: string }
        maskedPlate: { type: string, example: "ABC-••34" }
        driverLocation:
          allOf: [{ $ref: '#/components/schemas/GeoPoint' }]
          nullable: true
        eta: { type: string, format: date-time, nullable: true }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/OrderTimelineEntry' }
    RatingBody:
      type: object
      required: [stars]
      properties:
        stars: { type: integer, format: int32, minimum: 1, maximum: 5 }
        tagKeys:
          type: array
          items: { type: string, example: rating.tag.on_time }
        comment: { type: string, maxLength: 1000, nullable: true }
    Rating:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        stars: { type: integer, format: int32 }
        tagKeys:
          type: array
          items: { type: string }
        comment: { type: string, nullable: true }
        visible:
          type: boolean
          description: Ratings become visible once both sides submit or the window closes.
        createdAt: { type: string, format: date-time }

    # ------------------------------------------------------------------ driver
    DriverAvailability:
      type: object
      properties:
        available: { type: boolean }
        since: { type: string, format: date-time, nullable: true }
        blockedReasonKeys:
          type: array
          items: { type: string }
    DriverHome:
      type: object
      properties:
        availability: { $ref: '#/components/schemas/DriverAvailability' }
        activeOrder:
          allOf: [{ $ref: '#/components/schemas/OrderSummary' }]
          nullable: true
        wallet: { $ref: '#/components/schemas/Wallet' }
        earningsToday: { $ref: '#/components/schemas/Money' }
        earningsThisWeek: { $ref: '#/components/schemas/Money' }
        earningsThisMonth: { $ref: '#/components/schemas/Money' }
        ordersToday: { type: integer, format: int32 }
        ordersThisWeek: { type: integer, format: int32 }
        ordersThisMonth: { type: integer, format: int32 }
        ordersThisYear: { type: integer, format: int32 }
        ordersAllTime: { type: integer, format: int32 }
        vehicle:
          allOf: [{ $ref: '#/components/schemas/Vehicle' }]
          nullable: true
        tier: { $ref: '#/components/schemas/CarrierTier' }
        codHeld: { $ref: '#/components/schemas/Money' }
        unreadNotifications: { type: integer, format: int32 }
    Offer:
      type: object
      properties:
        offerId: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        roundNumber: { type: integer, format: int32 }
        expiresAt: { type: string, format: date-time }
        ttlSeconds: { type: integer, format: int32, example: 30 }
        status: { $ref: '#/components/schemas/OfferStatus' }
        pickup: { $ref: '#/components/schemas/OrderStop' }
        dropoff: { $ref: '#/components/schemas/OrderStop' }
        stopCount: { type: integer, format: int32 }
        distanceKm: { type: number, format: double }
        distanceToPickupKm: { type: number, format: double }
        vehicleTypeNameKey: { type: string }
        cargoTypeNameKey: { type: string }
        weightKg: { type: integer, format: int32 }
        fare: { $ref: '#/components/schemas/Money' }
        isCrossBorder: { type: boolean }
        isScheduled: { type: boolean }
        scheduledAt: { type: string, format: date-time, nullable: true }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        routePolyline: { type: string, nullable: true }
    PickupProofBody:
      type: object
      required: [verificationCode, photoUrls, location]
      properties:
        verificationCode: { type: string, example: "7249" }
        photoUrls:
          type: array
          minItems: 1
          items: { type: string, format: uri }
        location: { $ref: '#/components/schemas/GeoReport' }
        note: { type: string, maxLength: 500, nullable: true }
    StopProofBody:
      type: object
      required: [location]
      properties:
        photoUrls:
          type: array
          items: { type: string, format: uri }
        location: { $ref: '#/components/schemas/GeoReport' }
        note: { type: string, maxLength: 500, nullable: true }
    DeliveryProofBody:
      type: object
      required: [verificationCode, photoUrls, signatureUrl, location]
      properties:
        verificationCode: { type: string }
        photoUrls:
          type: array
          minItems: 1
          items: { type: string, format: uri }
        signatureUrl: { type: string, format: uri }
        receiverName: { type: string, nullable: true }
        location: { $ref: '#/components/schemas/GeoReport' }
        codCollected: { type: boolean, default: false }
        note: { type: string, maxLength: 500, nullable: true }
    EarningsSummary:
      type: object
      properties:
        available: { $ref: '#/components/schemas/Money' }
        pending: { $ref: '#/components/schemas/Money' }
        grossEarnings: { $ref: '#/components/schemas/Money' }
        commissionDeducted: { $ref: '#/components/schemas/Money' }
        codHeld: { $ref: '#/components/schemas/Money' }
        orderCount: { type: integer, format: int32 }
        items:
          type: array
          items:
            type: object
            properties:
              orderId: { type: integer, format: int64 }
              orderCode: { type: string }
              completedAt: { type: string, format: date-time }
              gross: { $ref: '#/components/schemas/Money' }
              commission: { $ref: '#/components/schemas/Money' }
              net: { $ref: '#/components/schemas/Money' }
              paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
    Driver:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        organizationId: { type: integer, format: int64, nullable: true }
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string }
        phone: { type: string }
        nationalId: { type: string, nullable: true }
        licenceNumber: { type: string, nullable: true }
        licenceExpiry: { type: string, format: date, nullable: true }
        passportNumber: { type: string, nullable: true }
        passportExpiry: { type: string, format: date, nullable: true }
        crossBorderPermit: { type: boolean }
        status: { $ref: '#/components/schemas/CarrierStatus' }
        ratingAvg: { type: number, format: double, nullable: true }
        isAvailable: { type: boolean }
        assignedVehicle:
          allOf: [{ $ref: '#/components/schemas/VehicleBrief' }]
          nullable: true
        documents:
          type: array
          items: { $ref: '#/components/schemas/DocumentRef' }
    FleetDriverBody:
      type: object
      required: [firstName, lastName, phone]
      properties:
        firstName: { type: string }
        middleName: { type: string, nullable: true }
        lastName: { type: string }
        phone: { type: string }
        nationalId: { type: string, nullable: true }
        licenceNumber: { type: string, nullable: true }
        licenceExpiry: { type: string, format: date, nullable: true }
        passportNumber: { type: string, nullable: true }
        passportExpiry: { type: string, format: date, nullable: true }
        crossBorderPermit: { type: boolean, default: false }
        assignedVehicleId: { type: integer, format: int64, nullable: true }
        active: { type: boolean, default: true }
    Vehicle:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organizationId: { type: integer, format: int64, nullable: true }
        ownerDriverId: { type: integer, format: int64, nullable: true }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        plateNumber: { type: string }
        plateCountry: { type: string }
        model: { type: string, nullable: true }
        year: { type: integer, format: int32, nullable: true }
        color: { type: string, nullable: true }
        capacityKg: { type: integer, format: int32 }
        status: { type: string, enum: [ACTIVE, INACTIVE, MAINTENANCE, BLOCKED] }
        verified: { type: boolean }
        documentsValid: { type: boolean }
        documents:
          type: array
          items: { $ref: '#/components/schemas/DocumentRef' }
        soonestDocumentExpiry: { type: string, format: date, nullable: true }
    VehicleBody:
      type: object
      required: [vehicleTypeId, plateNumber, plateCountry, capacityKg]
      properties:
        vehicleTypeId: { type: integer, format: int64 }
        plateNumber: { type: string, maxLength: 32 }
        plateCountry: { type: string, minLength: 2, maxLength: 2 }
        model: { type: string, nullable: true }
        year: { type: integer, format: int32, nullable: true }
        color: { type: string, nullable: true }
        capacityKg: { type: integer, format: int32, minimum: 1 }
        allowedCargoTypeIds:
          type: array
          items: { type: integer, format: int64 }
        status: { type: string, enum: [ACTIVE, INACTIVE, MAINTENANCE], default: ACTIVE }
    LiveDriver:
      type: object
      properties:
        driverId: { type: integer, format: int64 }
        displayName: { type: string }
        organizationId: { type: integer, format: int64, nullable: true }
        location: { $ref: '#/components/schemas/GeoPoint' }
        heading: { type: number, format: double, nullable: true }
        speed: { type: number, format: double, nullable: true }
        state: { type: string, enum: [ONLINE, ON_TRIP, IDLE, OFFLINE] }
        activeOrderId: { type: integer, format: int64, nullable: true }
        vehicleTypeNameKey: { type: string }
        plateNumber: { type: string }
        lastPingAt: { type: string, format: date-time }
        distanceFromCityKm: { type: number, format: double, nullable: true }
    HandoverBody:
      type: object
      required: [reason, location]
      properties:
        newDriverId: { type: integer, format: int64, nullable: true }
        newVehicleId: { type: integer, format: int64, nullable: true }
        location: { $ref: '#/components/schemas/GeoPoint' }
        photoUrls:
          type: array
          items: { type: string, format: uri }
        reason: { type: string, maxLength: 500 }
    FleetOverview:
      type: object
      properties:
        activeOrders: { type: integer, format: int32 }
        completedThisMonth: { type: integer, format: int32 }
        onlineDrivers: { type: integer, format: int32 }
        totalDrivers: { type: integer, format: int32 }
        totalVehicles: { type: integer, format: int32 }
        vehiclesWithExpiringDocs: { type: integer, format: int32 }
        revenueThisMonth: { $ref: '#/components/schemas/Money' }
        availableBalance: { $ref: '#/components/schemas/Money' }
        codHeld: { $ref: '#/components/schemas/Money' }
        ratingAvg: { type: number, format: double, nullable: true }
        tier: { $ref: '#/components/schemas/CarrierTier' }
        openViolations: { type: integer, format: int32 }

    # ------------------------------------------------------------------- money
    Wallet:
      type: object
      properties:
        ownerType: { type: string, enum: [CLIENT, CARRIER, ORGANIZATION] }
        balance: { $ref: '#/components/schemas/Money' }
        heldBalance: { $ref: '#/components/schemas/Money' }
        availableBalance: { $ref: '#/components/schemas/Money' }
    WalletTransaction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type:
          type: string
          enum: [TOPUP, ORDER_PAYMENT, ORDER_EARNING, COMMISSION, REFUND, PAYOUT, ADJUSTMENT, SUBSCRIPTION, COD_SETTLEMENT]
        amount: { $ref: '#/components/schemas/Money' }
        balanceAfter: { $ref: '#/components/schemas/Money' }
        descriptionKey: { type: string }
        orderId: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, format: date-time }
    Payment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64, nullable: true }
        provider: { type: string }
        providerRef: { type: string, nullable: true }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amount: { $ref: '#/components/schemas/Money' }
        refundedAmount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        failureCode: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    PayoutAccount:
      type: object
      properties:
        id: { type: integer, format: int64 }
        countryCode: { type: string }
        methodCode: { type: string, example: BANK_IBAN }
        methodNameKey: { type: string }
        maskedIdentifier: { type: string, example: "IQ** **** **** 4321" }
        verifyStatus: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
    PayoutAccountBody:
      type: object
      required: [countryCode, methodCode, accountFields]
      properties:
        countryCode: { type: string }
        methodCode: { type: string }
        accountFields:
          type: object
          additionalProperties: { type: string }
          example:
            iban: IQ12BANK0000000012344321
            accountHolder: Ahmed Ali
        isDefault: { type: boolean, default: false }
    Payout:
      type: object
      properties:
        id: { type: integer, format: int64 }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        triggerType: { type: string, enum: [ON_DEMAND, THRESHOLD, MANUAL] }
        payoutAccount: { $ref: '#/components/schemas/PayoutAccount' }
        orderCount: { type: integer, format: int32 }
        feeMinor: { type: integer, format: int64 }
        rejectionReason: { type: string, nullable: true }
        requestedAt: { type: string, format: date-time }
        processedAt: { type: string, format: date-time, nullable: true }
    CodCollection:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        orderCode: { type: string }
        driverId: { type: integer, format: int64 }
        driverName: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/CodStatus' }
        settleMethod:
          allOf: [{ $ref: '#/components/schemas/CodSettleMethod' }]
          nullable: true
        depositSlipUrl: { type: string, format: uri, nullable: true }
        reference: { type: string, nullable: true }
        dueAt: { type: string, format: date-time, nullable: true }
        collectedAt: { type: string, format: date-time }
        settledAt: { type: string, format: date-time, nullable: true }
    CodSummary:
      type: object
      properties:
        totalHeld: { $ref: '#/components/schemas/Money' }
        limit: { $ref: '#/components/schemas/Money' }
        overdueCount: { type: integer, format: int32 }
        blocksNewOrders: { type: boolean }
        collections:
          type: array
          items: { $ref: '#/components/schemas/CodCollection' }
    SubscriptionPlan:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: BUSINESS }
        nameKey: { type: string }
        descriptionKey: { type: string, nullable: true }
        countryCode: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        billingCycle: { type: string, enum: [MONTHLY, ANNUAL] }
        isActive: { type: boolean }
        benefits:
          type: array
          items: { $ref: '#/components/schemas/PlanBenefit' }
    PlanBenefit:
      type: object
      description: Every benefit is an explicit toggle plus an optional value, editable in the CP.
      properties:
        key:
          type: string
          example: FREE_CANCELLATIONS_PER_MONTH
        labelKey: { type: string }
        enabled: { type: boolean }
        value: { type: number, format: double, nullable: true }
        valueType: { type: string, enum: [COUNT, PERCENT, MULTIPLIER, MONEY, BOOLEAN, UNLIMITED] }
    SubscriptionPlanBody:
      type: object
      required: [code, countryCode, priceMinor, currency, billingCycle]
      properties:
        code: { type: string }
        nameKey: { type: string }
        descriptionKey: { type: string, nullable: true }
        countryCode: { type: string }
        priceMinor: { type: integer, format: int64 }
        currency: { type: string }
        billingCycle: { type: string, enum: [MONTHLY, ANNUAL] }
        isActive: { type: boolean, default: true }
        benefits:
          type: array
          items: { $ref: '#/components/schemas/PlanBenefit' }
    Subscription:
      type: object
      properties:
        id: { type: integer, format: int64 }
        plan: { $ref: '#/components/schemas/SubscriptionPlan' }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        currentPeriodEnd: { type: string, format: date-time, nullable: true }
        autoRenew: { type: boolean }
        freeCancellationsUsed: { type: integer, format: int32 }
        creditLimit:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
        creditUsed:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
    SubscriptionResult:
      type: object
      properties:
        subscription: { $ref: '#/components/schemas/Subscription' }
        checkout:
          allOf: [{ $ref: '#/components/schemas/CheckoutResult' }]
          nullable: true

    # -------------------------------------------------------------------- chat
    Conversation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        participants:
          type: array
          items:
            type: object
            properties:
              userId: { type: integer, format: int64 }
              displayName: { type: string }
              role: { type: string, enum: [CLIENT, DRIVER, SUPPORT, ADMIN] }
              avatarUrl: { type: string, format: uri, nullable: true }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        hasMore: { type: boolean }
        unreadCount: { type: integer, format: int32 }
    Message:
      type: object
      properties:
        id: { type: integer, format: int64 }
        conversationId: { type: integer, format: int64 }
        senderId: { type: integer, format: int64 }
        senderRole: { type: string, enum: [CLIENT, DRIVER, SUPPORT, ADMIN, SYSTEM] }
        type: { $ref: '#/components/schemas/MessageType' }
        body: { type: string, nullable: true }
        mediaUrl: { type: string, format: uri, nullable: true }
        durationSeconds: { type: integer, format: int32, nullable: true }
        systemMessageKey: { type: string, nullable: true }
        isFlagged: { type: boolean }
        sentAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
    MessageBody:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/MessageType' }
        body: { type: string, maxLength: 4000, nullable: true }
        mediaId: { type: string, nullable: true }
        clientMessageId:
          type: string
          nullable: true
          description: Client-generated id for optimistic UI and deduplication.

    # ----------------------------------------------------------- notifications
    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        category:
          type: string
          enum: [ORDER, OFFER, PAYMENT, PAYOUT, SUBSCRIPTION, TIER, VIOLATION, DOCUMENT, CHAT, SYSTEM, MARKETING]
        titleKey: { type: string }
        bodyKey: { type: string }
        params:
          type: object
          additionalProperties: true
        deepLink: { type: string, nullable: true, example: nextfreight://orders/72 }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    NotificationPreferences:
      type: object
      properties:
        categories:
          type: object
          additionalProperties:
            type: object
            properties:
              push: { type: boolean }
              inApp: { type: boolean }
              sms: { type: boolean }
              email: { type: boolean }
        quietHoursStart: { type: string, nullable: true, example: "22:00" }
        quietHoursEnd: { type: string, nullable: true, example: "07:00" }
    Device:
      type: object
      properties:
        deviceId: { type: string }
        platform: { type: string, enum: [android, ios, web] }
        appVersion: { type: string }
        registeredAt: { type: string, format: date-time }
    DeviceBody:
      type: object
      required: [deviceId, platform, fcmToken]
      properties:
        deviceId: { type: string }
        platform: { type: string, enum: [android, ios, web] }
        fcmToken: { type: string }
        appVersion: { type: string }
        osVersion: { type: string, nullable: true }
        deviceModel: { type: string, nullable: true }

    # -------------------------------------------------------------- compliance
    ViolationRule:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: LATE_DELIVERY }
        nameKey: { type: string }
        countryCode: { type: string, nullable: true, description: Null means global. }
        severity: { $ref: '#/components/schemas/ViolationSeverity' }
        threshold: { type: number, format: double }
        thresholdUnit: { type: string, example: MINUTES }
        windowDays: { type: integer, format: int32 }
        points: { type: integer, format: int32 }
        autoAction: { $ref: '#/components/schemas/ViolationActionType' }
        graceMinutes: { type: integer, format: int32 }
        isActive: { type: boolean }
    ViolationRuleBody:
      type: object
      required: [code, severity, threshold, points]
      properties:
        code: { type: string }
        nameKey: { type: string }
        countryCode: { type: string, nullable: true }
        severity: { $ref: '#/components/schemas/ViolationSeverity' }
        threshold: { type: number, format: double }
        thresholdUnit: { type: string }
        windowDays: { type: integer, format: int32, default: 30 }
        points: { type: integer, format: int32 }
        autoAction: { $ref: '#/components/schemas/ViolationActionType' }
        graceMinutes: { type: integer, format: int32, default: 0 }
        isActive: { type: boolean, default: true }
    Violation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        rule: { $ref: '#/components/schemas/ViolationRule' }
        subjectType: { type: string, enum: [DRIVER, CARRIER, ORGANIZATION, CLIENT] }
        subjectId: { type: integer, format: int64 }
        subjectName: { type: string }
        orderId: { type: integer, format: int64, nullable: true }
        orderCode: { type: string, nullable: true }
        points: { type: integer, format: int32 }
        status: { $ref: '#/components/schemas/ViolationStatus' }
        evidence:
          type: object
          additionalProperties: true
          description: GPS excerpt, timestamps, thresholds and measured values.
        actions:
          type: array
          items: { $ref: '#/components/schemas/ViolationAction' }
        appeal:
          allOf: [{ $ref: '#/components/schemas/Appeal' }]
          nullable: true
        detectedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
    ViolationAction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actionType: { $ref: '#/components/schemas/ViolationActionType' }
        isAutomatic: { type: boolean }
        appliedBy: { type: integer, format: int64, nullable: true }
        appliedAt: { type: string, format: date-time }
        until: { type: string, format: date-time, nullable: true }
        reversedAt: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
    Appeal:
      type: object
      properties:
        id: { type: integer, format: int64 }
        violationId: { type: integer, format: int64 }
        message: { type: string }
        attachmentUrls:
          type: array
          items: { type: string, format: uri }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED] }
        resolutionNote: { type: string, nullable: true }
        resolvedBy: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
    CarrierTier:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: GOLD }
        nameKey: { type: string }
        minScore: { type: integer, format: int32 }
        commissionDiscountPercent: { type: number, format: double }
        dispatchPriorityWeight: { type: number, format: double }
        payoutHoldHours: { type: integer, format: int32 }
        codLimitMinor: { type: integer, format: int64 }
        crossBorderPriority: { type: boolean }
        currentScore: { type: integer, format: int32, nullable: true }
        isManualOverride: { type: boolean, default: false }
        overrideUntil: { type: string, format: date-time, nullable: true }
    CarrierTierBody:
      type: object
      required: [code, minScore]
      properties:
        code: { type: string }
        nameKey: { type: string }
        minScore: { type: integer, format: int32 }
        commissionDiscountPercent: { type: number, format: double, default: 0 }
        dispatchPriorityWeight: { type: number, format: double, default: 1 }
        payoutHoldHours: { type: integer, format: int32, default: 24 }
        codLimitMinor: { type: integer, format: int64 }
        crossBorderPriority: { type: boolean, default: false }
    TierScoringRule:
      type: object
      required: [metric, weight]
      properties:
        metric:
          type: string
          enum:
            - COMPLETED_ORDERS
            - ACCEPTANCE_RATE
            - ON_TIME_PICKUP_RATE
            - ON_TIME_DELIVERY_RATE
            - AVERAGE_RATING
            - REVENUE_GENERATED
            - CANCELLATION_RATE
            - VIOLATION_POINTS
            - DOCUMENT_COMPLIANCE
        weight: { type: number, format: double }
        direction: { type: string, enum: [HIGHER_IS_BETTER, LOWER_IS_BETTER] }
        windowDays: { type: integer, format: int32, default: 90 }
        isActive: { type: boolean, default: true }

    # ------------------------------------------------------------ admin pricing
    RateCard:
      type: object
      properties:
        id: { type: integer, format: int64 }
        countryCode: { type: string }
        currency: { type: string }
        version: { type: integer, format: int32 }
        name: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        effectiveTo: { type: string, format: date-time, nullable: true }
        isActive: { type: boolean }
        createdBy: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    RateCardBody:
      type: object
      required: [countryCode, name]
      properties:
        countryCode: { type: string }
        name: { type: string }
        cloneFromRateCardId: { type: integer, format: int64, nullable: true }
    PricingFactor:
      type: object
      properties:
        id: { type: integer, format: int64 }
        factorGroup:
          type: string
          enum: [BASE, DISTANCE, WEIGHT, VEHICLE, CARGO, GEOGRAPHY, TIME, STOPS, WAITING, RISK, COMMERCIAL, TAX]
        factorKey: { type: string, example: rate_per_km }
        labelKey: { type: string }
        calcType: { type: string, enum: [FIXED, PER_UNIT, PERCENT, MULTIPLIER, TIERED] }
        value: { type: number, format: double }
        conditions:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            Optional matcher, for example `{"vehicleTypeId":3}` or
            `{"distanceFromKm":0,"distanceToKm":50}` for tiered bands.
        priority: { type: integer, format: int32 }
    PricingFactorBody:
      type: object
      required: [factorGroup, factorKey, calcType, value]
      properties:
        factorGroup: { type: string }
        factorKey: { type: string }
        labelKey: { type: string }
        calcType: { type: string, enum: [FIXED, PER_UNIT, PERCENT, MULTIPLIER, TIERED] }
        value: { type: number, format: double }
        conditions:
          type: object
          additionalProperties: true
          nullable: true
        priority: { type: integer, format: int32, default: 100 }
    RateCardDiff:
      type: object
      properties:
        sampleSize: { type: integer, format: int32 }
        averageChangePercent: { type: number, format: double }
        medianChangePercent: { type: number, format: double }
        increasedCount: { type: integer, format: int32 }
        decreasedCount: { type: integer, format: int32 }
        unchangedCount: { type: integer, format: int32 }
        largestIncreasePercent: { type: number, format: double }
        largestDecreasePercent: { type: number, format: double }
        samples:
          type: array
          items:
            type: object
            properties:
              orderId: { type: integer, format: int64 }
              oldTotal: { $ref: '#/components/schemas/Money' }
              newTotal: { $ref: '#/components/schemas/Money' }
              changePercent: { type: number, format: double }
    CorridorFee:
      type: object
      properties:
        id: { type: integer, format: int64 }
        corridorId: { type: integer, format: int64 }
        vehicleTypeId: { type: integer, format: int64, nullable: true }
        cargoTypeId: { type: integer, format: int64, nullable: true }
        feeType:
          type: string
          enum:
            - CUSTOMS_CLEARANCE
            - BORDER_ENTRY_FEE
            - TRANSIT_PERMIT
            - ESCORT_OR_CONVOY
            - BORDER_WAITING_PER_DAY
            - CARGO_INSURANCE_PERCENT
            - DOCUMENTS_FEE
            - DRIVER_ENTRY_OR_VISA
            - SCANNER_OR_INSPECTION
            - AGENT_COMMISSION
        calcType: { type: string, enum: [FIXED, PER_UNIT, PERCENT] }
        value: { type: number, format: double }
        currency: { type: string }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
    CorridorFeeBody:
      type: object
      required: [feeType, calcType, value, currency]
      properties:
        vehicleTypeId: { type: integer, format: int64, nullable: true }
        cargoTypeId: { type: integer, format: int64, nullable: true }
        feeType: { type: string }
        calcType: { type: string, enum: [FIXED, PER_UNIT, PERCENT] }
        value: { type: number, format: double }
        currency: { type: string }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }

    # -------------------------------------------------------------- admin ops
    DashboardStats:
      type: object
      properties:
        totalOrders: { type: integer, format: int64 }
        activeOrders: { type: integer, format: int32 }
        completionRatePercent: { type: number, format: double }
        revenue: { $ref: '#/components/schemas/Money' }
        commission: { $ref: '#/components/schemas/Money' }
        averageRating: { type: number, format: double, nullable: true }
        onlineDrivers: { type: integer, format: int32 }
        pendingApplications: { type: integer, format: int32 }
        pendingPayouts: { type: integer, format: int32 }
        unsettledCod: { $ref: '#/components/schemas/Money' }
        trends:
          type: array
          items:
            type: object
            properties:
              bucket: { type: string, example: 2026-07-28 }
              orders: { type: integer, format: int32 }
              revenueMinor: { type: integer, format: int64 }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/OpsAlert' }
    OpsAlert:
      type: object
      properties:
        type:
          type: string
          enum: [DELIVERY_DELAYED, DRIVER_UNREACHABLE, LOW_WALLET, DOCUMENT_EXPIRING, PENDING_APPLICATION, SOS, COD_OVERDUE, PAYMENT_FAILED]
        severity: { $ref: '#/components/schemas/ViolationSeverity' }
        titleKey: { type: string }
        params:
          type: object
          additionalProperties: true
        entityType: { type: string }
        entityId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    AdminOrderDetail:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            payments:
              type: array
              items: { $ref: '#/components/schemas/Payment' }
            codCollection:
              allOf: [{ $ref: '#/components/schemas/CodCollection' }]
              nullable: true
            offers:
              type: array
              items: { $ref: '#/components/schemas/Offer' }
            violations:
              type: array
              items: { $ref: '#/components/schemas/Violation' }
            locationTrail:
              type: array
              items: { $ref: '#/components/schemas/LocationPoint' }
            auditLogs:
              type: array
              items: { $ref: '#/components/schemas/AuditLog' }
            brokerMargin:
              allOf: [{ $ref: '#/components/schemas/Money' }]
              nullable: true
            handovers:
              type: array
              items:
                type: object
                properties:
                  fromDriverId: { type: integer, format: int64, nullable: true }
                  toDriverId: { type: integer, format: int64, nullable: true }
                  fromVehicleId: { type: integer, format: int64, nullable: true }
                  toVehicleId: { type: integer, format: int64, nullable: true }
                  location: { $ref: '#/components/schemas/GeoPoint' }
                  reason: { type: string }
                  occurredAt: { type: string, format: date-time }
    DispatchQueueItem:
      type: object
      properties:
        order: { $ref: '#/components/schemas/OrderSummary' }
        roundsAttempted: { type: integer, format: int32 }
        lastBroadcastAt: { type: string, format: date-time, nullable: true }
        candidatesReached: { type: integer, format: int32 }
        waitingMinutes: { type: integer, format: int32 }
        slaBreached: { type: boolean }
    DispatchCandidate:
      type: object
      properties:
        carrierId: { type: integer, format: int64 }
        driverId: { type: integer, format: int64, nullable: true }
        displayName: { type: string }
        vehicle: { $ref: '#/components/schemas/VehicleBrief' }
        distanceToPickupKm: { type: number, format: double }
        tierCode: { type: string }
        ratingAvg: { type: number, format: double, nullable: true }
        acceptanceRatePercent: { type: number, format: double }
        openViolationPoints: { type: integer, format: int32 }
        totalScore: { type: number, format: double }
        scoreBreakdown:
          type: object
          additionalProperties: { type: number, format: double }
        eligible: { type: boolean }
        ineligibleReasonKeys:
          type: array
          items: { type: string }
    AdminUser:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        userKind: { $ref: '#/components/schemas/UserKind' }
        displayName: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        countryCode: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DEACTIVATED] }
        suspendedUntil: { type: string, format: date-time, nullable: true }
        organizationId: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time, nullable: true }
    CarrierSummary:
      type: object
      properties:
        carrierId: { type: integer, format: int64 }
        carrierType: { $ref: '#/components/schemas/CarrierType' }
        displayName: { type: string }
        phone: { type: string }
        countryCode: { type: string }
        status: { $ref: '#/components/schemas/CarrierStatus' }
        tierCode: { type: string }
        ratingAvg: { type: number, format: double, nullable: true }
        completedOrders: { type: integer, format: int32 }
        violationPoints: { type: integer, format: int32 }
        vehicleCount: { type: integer, format: int32 }
        driverCount: { type: integer, format: int32 }
        codHeld: { $ref: '#/components/schemas/Money' }
    CarrierDetail:
      allOf:
        - $ref: '#/components/schemas/CarrierSummary'
        - type: object
          properties:
            organization:
              allOf: [{ $ref: '#/components/schemas/OrganizationBrief' }]
              nullable: true
            tier: { $ref: '#/components/schemas/CarrierTier' }
            tierScoreBreakdown:
              type: object
              additionalProperties: { type: number, format: double }
            drivers:
              type: array
              items: { $ref: '#/components/schemas/Driver' }
            vehicles:
              type: array
              items: { $ref: '#/components/schemas/Vehicle' }
            documents:
              type: array
              items: { $ref: '#/components/schemas/DocumentRef' }
            wallet: { $ref: '#/components/schemas/Wallet' }
            recentViolations:
              type: array
              items: { $ref: '#/components/schemas/Violation' }
            activeRestrictions:
              type: array
              items: { $ref: '#/components/schemas/ViolationAction' }
            approvedAt: { type: string, format: date-time, nullable: true }

    # ----------------------------------------------------------- admin system
    ReportResult:
      type: object
      properties:
        reportType: { type: string }
        generatedAt: { type: string, format: date-time }
        columns:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              labelKey: { type: string }
              type: { type: string, enum: [STRING, NUMBER, MONEY, PERCENT, DATE] }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        totals:
          type: object
          additionalProperties: true
          nullable: true
    ExportJob:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, RUNNING, READY, FAILED] }
        downloadUrl: { type: string, format: uri, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actorUserId: { type: integer, format: int64, nullable: true }
        actorName: { type: string, nullable: true }
        action: { type: string, example: ORDER_REPRICED }
        entityType: { type: string }
        entityId: { type: integer, format: int64, nullable: true }
        beforeData:
          type: object
          additionalProperties: true
          nullable: true
        afterData:
          type: object
          additionalProperties: true
          nullable: true
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    FeatureFlag:
      type: object
      properties:
        key: { type: string, example: cod_enabled }
        enabled: { type: boolean }
        countryCode: { type: string, nullable: true }
        description: { type: string, nullable: true }
    StaffUser:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        email: { type: string }
        fullName: { type: string }
        roles:
          type: array
          items: { type: string }
        countryScope:
          type: array
          items: { type: string }
        twoFactorEnabled: { type: boolean }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        lastLoginAt: { type: string, format: date-time, nullable: true }
    StaffUserBody:
      type: object
      required: [email, fullName, roles]
      properties:
        email: { type: string, format: email }
        fullName: { type: string }
        roles:
          type: array
          items: { type: string }
        countryScope:
          type: array
          items: { type: string }
        require2fa: { type: boolean, default: true }
    Role:
      type: object
      properties:
        code: { type: string }
        nameKey: { type: string }
        isSystem: { type: boolean }
        permissions:
          type: array
          items: { type: string }
    Permission:
      type: object
      properties:
        code: { type: string, example: order.assign }
        group: { type: string, example: ORDERS }
        descriptionKey: { type: string }
    SosAlert:
      type: object
      properties:
        id: { type: integer, format: int64 }
        driverId: { type: integer, format: int64 }
        driverName: { type: string }
        driverPhone: { type: string }
        orderId: { type: integer, format: int64, nullable: true }
        location: { $ref: '#/components/schemas/GeoPoint' }
        note: { type: string, nullable: true }
        status: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }
        resolvedBy: { type: integer, format: int64, nullable: true }
        resolutionNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
