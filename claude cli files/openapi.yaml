openapi: 3.0.3

info:
  title: NEXT Freight API
  version: 1.0.0
  description: |
    REST contract for the NEXT Freight platform: client app, driver app, fleet/broker portal
    and control panel.

    ## Conventions
    - Base path is `/v1`. Breaking changes require `/v2`.
    - All responses use an envelope: `{ success, data, error, meta }`.
    - Errors return `code` + `messageKey` + `params`. The server never returns translated text.
    - All money values are integer minor units plus a currency code. Never floating point.
    - All timestamps are UTC ISO-8601.
    - Money-moving requests require an `Idempotency-Key` header.
    - Prices are always computed server-side. A client-supplied price is always rejected.
  contact:
    name: NEXT Freight Engineering
  license:
    name: Proprietary

servers:
  - url: https://api.nextfreight.app/v1
    description: Production
  - url: https://staging-api.nextfreight.app/v1
    description: Staging
  - url: http://localhost:8080/v1
    description: Local

security:
  - bearerAuth: []

tags:
  - name: Config
    description: Bootstrap, catalogs and localization. Public.
  - name: Auth
    description: OTP login, token refresh, sessions, control panel login.
  - name: Registration
    description: Client self-serve signup and carrier applications requiring admin approval.
  - name: Profile
    description: Current user profile and preferences.
  - name: Addresses
    description: Client saved addresses.
  - name: Orders
    description: Client-facing order creation, quoting, payment and tracking.
  - name: Driver
    description: Driver availability, offers, trip execution and proofs.
  - name: Fleet
    description: Fleet company scoped portal.
  - name: Broker
    description: Brokerage company scoped portal.
  - name: Money
    description: Wallet, payouts, COD, subscriptions and payment webhooks.
  - name: Chat
    description: Per-order conversations.
  - name: Notifications
    description: Notification inbox, preferences and device registration.
  - name: Tracking
    description: Public tracking page.
  - name: Admin Dashboard
  - name: Admin Orders
  - name: Admin Users
  - name: Admin Applications
  - name: Admin Pricing
  - name: Admin Compliance
  - name: Admin Catalog
  - name: Admin Localization
  - name: Admin Plans
  - name: Admin Finance
  - name: Admin Reports
  - name: Admin System

paths:

  # ==========================================================================
  # CONFIG / PUBLIC
  # ==========================================================================

  /config/bootstrap:
    get:
      tags: [Config]
      summary: Application bootstrap
      description: Countries, feature flags and minimum supported app version. Called on cold start.
      security: []
      parameters:
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppPlatform'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Bootstrap' }
        '500': { $ref: '#/components/responses/ServerError' }

  /i18n/languages:
    get:
      tags: [Config]
      summary: List active languages
      description: Returns each language with its text direction and current bundle version.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Language' }

  /i18n/bundle:
    get:
      tags: [Config]
      summary: Download a translation bundle
      description: |
        Returns the full key/value bundle for a language. If `sinceVersion` is supplied and the
        server supports a delta, only changed keys are returned and `isDelta` is true.
      security: []
      parameters:
        - name: lang
          in: query
          required: true
          schema: { type: string, example: ar }
        - name: sinceVersion
          in: query
          required: false
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TranslationBundle' }
        '404': { $ref: '#/components/responses/NotFound' }

  /catalog/countries:
    get:
      tags: [Config]
      summary: List active countries
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Country' }

  /catalog/vehicle-types:
    get:
      tags: [Config]
      summary: List vehicle types for a country
      security: []
      parameters:
        - $ref: '#/components/parameters/CountryQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/VehicleType' }

  /catalog/cargo-types:
    get:
      tags: [Config]
      summary: List cargo types for a country
      security: []
      parameters:
        - $ref: '#/components/parameters/CountryQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CargoType' }

  /catalog/corridors:
    get:
      tags: [Config]
      summary: List active cross-border corridors
      security: []
      parameters:
        - name: fromCountry
          in: query
          schema: { type: string, example: TR }
        - name: toCountry
          in: query
          schema: { type: string, example: IQ }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Corridor' }

  # ==========================================================================
  # TRACKING (PUBLIC)
  # ==========================================================================

  /track/{token}:
    get:
      tags: [Tracking]
      summary: Public order tracking
      description: |
        Resolves an opaque share token. Contains no personal phone numbers and no full addresses.
        Returns 410 once the order is delivered or the link has been revoked.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicTracking' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Link disabled after delivery or revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ==========================================================================
  # AUTH
  # ==========================================================================

  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Request an OTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequestBody' }
      responses:
        '200':
          description: OTP dispatched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OtpChallenge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify an OTP code and issue tokens
      description: |
        For carriers the returned token may be a limited token when the account is not yet
        approved. `authContext.status` tells the app which screen to show.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyBody' }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate tokens
      description: Refresh tokens rotate on every use. Reuse of a consumed token revokes the family.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
                deviceId: { type: string }
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions and devices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SessionInfo' }

  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Revoke a session
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/cp/login:
    post:
      tags: [Auth]
      summary: Control panel login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Password accepted. When 2FA is enabled a partial token is returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CpLoginResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/cp/2fa/verify:
    post:
      tags: [Auth]
      summary: Verify TOTP and complete control panel login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partialToken, code]
              properties:
                partialToken: { type: string }
                code: { type: string, example: "482913" }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==========================================================================
  # PROFILE
  # ==========================================================================

  /me:
    get:
      tags: [Profile]
      summary: Current user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      summary: Update profile and preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdateBody' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ==========================================================================
  # REGISTRATION
  # ==========================================================================

  /registration/client:
    post:
      tags: [Registration]
      summary: Complete client signup
      description: |
        Called after OTP verification. Individual and company clients are both activated
        immediately. Companies additionally supply company details and may select a plan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientRegistrationBody' }
      responses:
        '201':
          description: Client activated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /registration/carrier/driver:
    post:
      tags: [Registration]
      summary: Start an individual driver application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverApplicationBody' }
      responses:
        '201': { $ref: '#/components/responses/ApplicationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /registration/carrier/fleet:
    post:
      tags: [Registration]
      summary: Start a fleet company application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetApplicationBody' }
      responses:
        '201': { $ref: '#/components/responses/ApplicationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /registration/carrier/broker:
    post:
      tags: [Registration]
      summary: Start a brokerage company application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrokerApplicationBody' }
      responses:
        '201': { $ref: '#/components/responses/ApplicationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /registration/{applicationId}/step/{stepNumber}:
    patch:
      tags: [Registration]
      summary: Auto-save a wizard step
      description: Each step is persisted so an interrupted applicant resumes where they stopped.
      parameters:
        - $ref: '#/components/parameters/ApplicationIdPath'
        - name: stepNumber
          in: path
          required: true
          schema: { type: integer, format: int32, minimum: 1, maximum: 7 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                  additionalProperties: true
                  description: Step payload. Shape depends on the application type and step.
      responses:
        '200': { $ref: '#/components/responses/ApplicationOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /registration/{applicationId}/documents:
    post:
      tags: [Registration]
      summary: Upload an application document
      parameters:
        - $ref: '#/components/parameters/ApplicationIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [docType, file]
              properties:
                docType: { $ref: '#/components/schemas/DocumentType' }
                subjectType:
                  type: string
                  enum: [DRIVER, VEHICLE, COMPANY]
                subjectRef:
                  type: string
                  description: Local reference of the vehicle or driver inside the application.
                expiryDate: { type: string, format: date }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DocumentRef' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /registration/{applicationId}/submit:
    post:
      tags: [Registration]
      summary: Submit the application for admin review
      parameters:
        - $ref: '#/components/parameters/ApplicationIdPath'
      responses:
        '200': { $ref: '#/components/responses/ApplicationOk' }
        '400':
          description: Missing mandatory fields or documents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /registration/{applicationId}/status:
    get:
      tags: [Registration]
      summary: Application status with reason keys
      parameters:
        - $ref: '#/components/parameters/ApplicationIdPath'
      responses:
        '200': { $ref: '#/components/responses/ApplicationOk' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================================
  # ADDRESSES
  # ==========================================================================

  /addresses:
    get:
      tags: [Addresses]
      summary: List saved addresses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SavedAddress' }
    post:
      tags: [Addresses]
      summary: Create a saved address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedAddressBody' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SavedAddress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: Plan limit on saved addresses reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /addresses/{addressId}:
    patch:
      tags: [Addresses]
      summary: Update a saved address
      parameters: [{ $ref: '#/components/parameters/AddressIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedAddressBody' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SavedAddress' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Addresses]
      summary: Delete a saved address
      parameters: [{ $ref: '#/components/parameters/AddressIdPath' }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================================
  # ORDERS (CLIENT)
  # ==========================================================================

  /orders/quote:
    post:
      tags: [Orders]
      summary: Price a draft order
      description: |
        Runs the pricing engine and returns an immutable breakdown plus a `quoteId` valid until
        `expiresAt`. The client must pass this `quoteId` to `POST /orders`. Any price supplied by
        the client is ignored. For cross-border routes the response contains one entry per leg plus
        the corridor fee bundle.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Quote produced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: |
            Business rule rejected the request. Common codes:
            `ORDER_WEIGHT_EXCEEDS_CAPACITY`, `CORRIDOR_NOT_SUPPORTED`,
            `NO_ACTIVE_RATE_CARD`, `CARGO_TYPE_RESTRICTED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /orders:
    get:
      tags: [Orders]
      summary: List own orders
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/OrderStatus' }
          style: form
          explode: false
        - name: scope
          in: query
          description: Filter to active or historical orders.
          schema: { type: string, enum: [ACTIVE, HISTORY, ALL], default: ALL }
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }
    post:
      tags: [Orders]
      summary: Create an order from a valid quote
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateBody' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Quote expired or already consumed. Codes `QUOTE_EXPIRED`, `QUOTE_ALREADY_USED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Order detail
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{orderId}/checkout:
    post:
      tags: [Orders]
      summary: Pay for an order or confirm cash on delivery
      description: |
        Returns gateway parameters when the method requires a redirect or SDK handoff.
        `COD` is accepted only when cash on delivery is enabled for the pickup country.
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutBody' }
      responses:
        '200':
          description: Checkout initiated or completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CheckoutResult' }
        '402':
          description: Payment declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Quote expired. The client must re-quote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Method not available for this country. Code `PAYMENT_METHOD_NOT_ALLOWED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      description: Returns the applied cancellation fee and the refund amount.
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string, example: CHANGED_MIND }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CancellationResult' }
        '409':
          description: Order state does not allow cancellation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /orders/{orderId}/tracking:
    get:
      tags: [Orders]
      summary: Live tracking snapshot
      description: Polling fallback. The primary channel is STOMP `/topic/order/{id}/location`.
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TrackingSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{orderId}/tracking-link:
    post:
      tags: [Orders]
      summary: Create a public tracking link
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TrackingLink' }
    delete:
      tags: [Orders]
      summary: Revoke the public tracking link
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      responses:
        '204': { description: Revoked }

  /orders/{orderId}/rate:
    post:
      tags: [Orders]
      summary: Rate the driver
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RatingBody' }
      responses:
        '201':
          description: Rating recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Rating' }
        '409':
          description: Already rated or rating window closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ==========================================================================
  # DRIVER
  # ==========================================================================

  /driver/availability:
    post:
      tags: [Driver]
      summary: Go online or offline
      description: |
        Going online is rejected when documents are expired, the account is suspended,
        a payout hold is active, or held cash exceeds the country limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties:
                available: { type: boolean }
                location: { $ref: '#/components/schemas/GeoPoint' }
      responses:
        '200':
          description: Availability updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DriverAvailability' }
        '422':
          description: |
            Blocked. Codes: `DOCUMENTS_EXPIRED`, `ACCOUNT_SUSPENDED`,
            `COD_LIMIT_EXCEEDED`, `NO_VERIFIED_VEHICLE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /driver/home:
    get:
      tags: [Driver]
      summary: Driver home summary
      description: Availability, active order, earnings totals, order counters and vehicle status.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DriverHome' }

  /driver/offers:
    get:
      tags: [Driver]
      summary: Pending offers
      description: Polling fallback. The primary channel is STOMP `/user/queue/offers`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Offer' }

  /driver/offers/{offerId}/accept:
    post:
      tags: [Driver]
      summary: Accept an offer
      description: Atomic. The first accepted offer wins; all others are closed immediately.
      parameters:
        - $ref: '#/components/parameters/OfferIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '409':
          description: |
            Offer no longer available. Codes `OFFER_EXPIRED`, `OFFER_TAKEN`, `OFFER_CANCELLED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /driver/offers/{offerId}/reject:
    post:
      tags: [Driver]
      summary: Reject an offer
      parameters: [{ $ref: '#/components/parameters/OfferIdPath' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reasonCode: { type: string, example: TOO_FAR }
      responses:
        '204': { description: Rejected }

  /driver/orders/active:
    get:
      tags: [Driver]
      summary: Current assigned order
      responses:
        '200':
          description: OK. `data` is null when the driver has no active order.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        allOf: [{ $ref: '#/components/schemas/Order' }]
                        nullable: true

  /driver/orders/{orderId}/start:
    post:
      tags: [Driver]
      summary: Start the trip towards pickup
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /driver/orders/{orderId}/arrived/{stopId}:
    post:
      tags: [Driver]
      summary: Report arrival at a stop
      description: The server validates the reported position against the stop geofence.
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/StopIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeoReport' }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422':
          description: Outside the geofence. Code `OUTSIDE_GEOFENCE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /driver/orders/{orderId}/pickup:
    post:
      tags: [Driver]
      summary: Confirm pickup with proof
      description: Requires the sender verification code and at least one loading photo.
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickupProofBody' }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '422':
          description: |
            Proof rejected. Codes `INVALID_VERIFICATION_CODE`, `PROOF_PHOTO_REQUIRED`,
            `OUTSIDE_GEOFENCE`, `MOCK_LOCATION_DETECTED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /driver/orders/{orderId}/stops/{stopId}/complete:
    post:
      tags: [Driver]
      summary: Complete an intermediate stop
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/StopIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StopProofBody' }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /driver/orders/{orderId}/deliver:
    post:
      tags: [Driver]
      summary: Complete delivery with proof
      description: Requires unloading photos, receiver signature and the receiver verification code.
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryProofBody' }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '422':
          description: Proof rejected. See pickup for the code list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /driver/orders/{orderId}/border/documents:
    post:
      tags: [Driver]
      summary: Submit corridor customs documents
      description: The required checklist is defined per corridor in the control panel.
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [docType, file]
              properties:
                docType: { $ref: '#/components/schemas/CustomsDocumentType' }
                legId: { type: integer, format: int64 }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DocumentRef' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /driver/orders/{orderId}/cancel:
    post:
      tags: [Driver]
      summary: Driver cancels an accepted order
      description: Raises a cancellation violation and returns the order to dispatch.
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string, example: VEHICLE_BREAKDOWN }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DriverCancellationResult' }

  /driver/location:
    post:
      tags: [Driver]
      summary: Submit a batch of GPS points
      description: |
        Points are buffered on the device while offline and replayed on reconnect.
        Send at most 100 points per call. Duplicates are ignored by `recordedAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/LocationPoint' }
      responses:
        '202': { description: Accepted }
        '400': { $ref: '#/components/responses/BadRequest' }

  /driver/earnings:
    get:
      tags: [Driver]
      summary: Earnings summary and breakdown
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [TODAY, WEEK, MONTH, YEAR, ALL, CUSTOM], default: WEEK }
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EarningsSummary' }

  /driver/history:
    get:
      tags: [Driver]
      summary: Completed order history
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }

  /driver/vehicle:
    get:
      tags: [Driver]
      summary: Assigned vehicle and document validity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Vehicle' }

  /driver/violations:
    get:
      tags: [Driver]
      summary: Own violations and active restrictions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Violation' }

  /driver/violations/{violationId}/appeal:
    post:
      tags: [Driver]
      summary: Appeal a violation
      parameters: [{ $ref: '#/components/parameters/ViolationIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 2000 }
                attachmentUrls:
                  type: array
                  items: { type: string, format: uri }
      responses:
        '201':
          description: Appeal submitted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Appeal' }
        '409':
          description: Already appealed or appeal window closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /driver/sos:
    post:
      tags: [Driver]
      summary: Raise an emergency alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location]
              properties:
                location: { $ref: '#/components/schemas/GeoPoint' }
                orderId: { type: integer, format: int64, nullable: true }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Alert raised
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SosAlert' }

  # ==========================================================================
  # FLEET PORTAL
  # ==========================================================================

  /fleet/overview:
    get:
      tags: [Fleet]
      summary: Fleet KPIs
      description: Scoped to the caller's organization. Cross-organization access is impossible.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FleetOverview' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /fleet/drivers:
    get:
      tags: [Fleet]
      summary: List company drivers
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Driver' }
    post:
      tags: [Fleet]
      summary: Add a company driver
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetDriverBody' }
      responses:
        '201':
          description: Created, pending platform verification
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Driver' }
        '409': { $ref: '#/components/responses/Conflict' }

  /fleet/drivers/{driverId}:
    patch:
      tags: [Fleet]
      summary: Update a company driver
      parameters: [{ $ref: '#/components/parameters/DriverIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetDriverBody' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Driver' }
        '404': { $ref: '#/components/responses/NotFound' }

  /fleet/vehicles:
    get:
      tags: [Fleet]
      summary: List company vehicles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Vehicle' }
    post:
      tags: [Fleet]
      summary: Add a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleBody' }
      responses:
        '201':
          description: Created, pending verification
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Vehicle' }

  /fleet/vehicles/{vehicleId}:
    patch:
      tags: [Fleet]
      summary: Update a vehicle
      parameters: [{ $ref: '#/components/parameters/VehicleIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleBody' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Vehicle' }

  /fleet/orders:
    get:
      tags: [Fleet]
      summary: Company orders
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/OrderStatus' }
          style: form
          explode: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }

  /fleet/orders/{orderId}/assign:
    post:
      tags: [Fleet]
      summary: Assign a company driver and vehicle to an accepted order
      description: |
        Must be done within the configured window after the company accepted the order,
        otherwise the order returns to the dispatch pool.
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverId, vehicleId]
              properties:
                driverId: { type: integer, format: int64 }
                vehicleId: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '422':
          description: |
            Assignment rejected. Codes `DRIVER_NOT_ELIGIBLE`, `VEHICLE_CAPACITY_INSUFFICIENT`,
            `DRIVER_DOCUMENTS_EXPIRED`, `ASSIGNMENT_WINDOW_EXPIRED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fleet/orders/{orderId}/handover:
    post:
      tags: [Fleet]
      summary: Record a custody handover
      description: |
        Used when the carrier changes the vehicle or driver mid-order, for example at a border.
        The order, the contract and the price stay unchanged; the timeline records the change.
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoverBody' }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '422':
          description: Handover rejected. Code `HANDOVER_TARGET_NOT_ELIGIBLE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fleet/live-map:
    get:
      tags: [Fleet]
      summary: Live positions of company drivers only
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LiveDriver' }

  /fleet/violations:
    get:
      tags: [Fleet]
      summary: Company and driver violations
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Violation' }

  # ==========================================================================
  # BROKER PORTAL
  # ==========================================================================

  /broker/board:
    get:
      tags: [Broker]
      summary: Claimable orders
      parameters:
        - $ref: '#/components/parameters/CountryQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }

  /broker/orders/{orderId}/claim:
    post:
      tags: [Broker]
      summary: Claim an order as the responsible carrier
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '409':
          description: Already claimed or assigned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /broker/orders/{orderId}/assign-carrier:
    post:
      tags: [Broker]
      summary: Re-assign a claimed order to a contracted carrier
      description: The broker margin is recorded as a separate ledger entry.
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrierId]
              properties:
                carrierId: { type: integer, format: int64 }
                driverId: { type: integer, format: int64, nullable: true }
                vehicleId: { type: integer, format: int64, nullable: true }
                marginMinor:
                  type: integer
                  format: int64
                  description: Broker margin in minor units. Validated against the configured cap.
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '422':
          description: Code `BROKER_MARGIN_EXCEEDS_CAP` or `CARRIER_NOT_CONTRACTED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ==========================================================================
  # MONEY
  # ==========================================================================

  /wallet:
    get:
      tags: [Money]
      summary: Wallet balance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Wallet' }

  /wallet/transactions:
    get:
      tags: [Money]
      summary: Wallet transactions
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WalletTransaction' }

  /wallet/topup:
    post:
      tags: [Money]
      summary: Top up the wallet
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, currency, method]
              properties:
                amountMinor: { type: integer, format: int64, minimum: 1 }
                currency: { type: string, minLength: 3, maxLength: 3 }
                method: { $ref: '#/components/schemas/PaymentMethod' }
      responses:
        '200':
          description: Top-up initiated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CheckoutResult' }

  /payout-accounts:
    get:
      tags: [Money]
      summary: List payout accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PayoutAccount' }
    post:
      tags: [Money]
      summary: Add a payout account
      description: |
        `accountFields` is validated against the country payout method definition returned by
        `/config/bootstrap`. Example fields: `iban`, `bankName`, `accountHolder`, `walletPhone`, `alias`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutAccountBody' }
      responses:
        '201':
          description: Created, pending verification
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayoutAccount' }
        '422':
          description: Method not available in this country or invalid account fields.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /payout-accounts/{accountId}:
    delete:
      tags: [Money]
      summary: Remove a payout account
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Removed }

  /payouts:
    get:
      tags: [Money]
      summary: List own payouts
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PayoutStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Payout' }

  /payouts/request:
    post:
      tags: [Money]
      summary: Request a payout
      description: |
        On demand. There is no fixed payout day. Blocked when a payout hold is active,
        the payout account is unverified, unsettled cash exceeds the limit, or an included
        order is under dispute.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payoutAccountId]
              properties:
                payoutAccountId: { type: integer, format: int64 }
                amountMinor:
                  type: integer
                  format: int64
                  nullable: true
                  description: Omit to request the full available balance.
      responses:
        '201':
          description: Requested
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Payout' }
        '422':
          description: |
            Codes `PAYOUT_HOLD_ACTIVE`, `BELOW_MINIMUM_PAYOUT`, `ACCOUNT_NOT_VERIFIED`,
            `COD_UNSETTLED`, `ORDER_UNDER_DISPUTE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /cod/held:
    get:
      tags: [Money]
      summary: Cash currently held by the driver
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CodSummary' }

  /cod/{collectionId}/submit:
    post:
      tags: [Money]
      summary: Submit a cash settlement
      description: |
        `BANK_DEPOSIT` requires a deposit slip upload. `OFFICE_HANDOVER` is recorded by staff in
        the control panel and only acknowledged here. Final settlement is confirmed by finance.
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { $ref: '#/components/schemas/CodSettleMethod' }
                depositSlipUrl: { type: string, format: uri, nullable: true }
                reference: { type: string, nullable: true }
      responses:
        '200':
          description: Submitted for verification
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CodCollection' }

  /subscriptions/plans:
    get:
      tags: [Money]
      summary: Available subscription plans for a country
      parameters: [{ $ref: '#/components/parameters/CountryQuery' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SubscriptionPlan' }

  /subscriptions:
    get:
      tags: [Money]
      summary: Current subscription
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        allOf: [{ $ref: '#/components/schemas/Subscription' }]
                        nullable: true
    post:
      tags: [Money]
      summary: Subscribe to a plan
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: integer, format: int64 }
                paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
      responses:
        '201':
          description: Subscribed or awaiting payment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SubscriptionResult' }

  /subscriptions/cancel:
    post:
      tags: [Money]
      summary: Cancel auto-renewal
      description: The plan stays active until the end of the current period.
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Subscription' }

  /webhooks/payments/{provider}:
    post:
      tags: [Money]
      summary: Payment provider webhook
      description: |
        Signature-verified and idempotent by `provider_ref`. Never trusts the payload amount
        without re-reading the payment record.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [hyperpay, zaincash, cliq, stcpay] }
        - name: X-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Processed }
        '401': { description: Invalid signature }

  # ==========================================================================
  # CHAT
  # ==========================================================================

  /orders/{orderId}/chat:
    get:
      tags: [Chat]
      summary: Fetch the order conversation
      description: Cursor paginated, newest first. History is retained permanently for disputes.
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - name: before
          in: query
          description: Return messages older than this message id.
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Conversation' }

  /orders/{orderId}/chat/messages:
    post:
      tags: [Chat]
      summary: Send a message
      description: For image and voice messages, upload first via `/chat/media` then send the reference.
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageBody' }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/{orderId}/chat/media:
    post:
      tags: [Chat]
      summary: Upload chat media
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type: { type: string, enum: [IMAGE, VOICE] }
                durationSeconds: { type: integer, format: int32, nullable: true }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MediaRef' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { description: Unsupported media type }

  /orders/{orderId}/chat/read:
    post:
      tags: [Chat]
      summary: Mark messages as read
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lastReadMessageId]
              properties:
                lastReadMessageId: { type: integer, format: int64 }
      responses:
        '204': { description: Marked }

  # ==========================================================================
  # NOTIFICATIONS & DEVICES
  # ==========================================================================

  /notifications:
    get:
      tags: [Notifications]
      summary: Notification inbox
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }

  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: Mark a notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Marked }

  /notifications/preferences:
    get:
      tags: [Notifications]
      summary: Get notification preferences
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotificationPreferences' }
    patch:
      tags: [Notifications]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotificationPreferences' }

  /devices:
    post:
      tags: [Notifications]
      summary: Register a push device
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceBody' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Device' }

  /devices/{deviceId}:
    delete:
      tags: [Notifications]
      summary: Unregister a push device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Unregistered }

  # ==========================================================================
  # ADMIN — DASHBOARD & LIVE MAP
  # ==========================================================================

  /admin/dashboard:
    get:
      tags: [Admin Dashboard]
      summary: Overview KPIs and alerts
      description: Requires `report.view`.
      parameters:
        - $ref: '#/components/parameters/CountryQuery'
        - name: range
          in: query
          schema: { type: string, enum: [TODAY, WEEK, MONTH, YEAR], default: MONTH }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DashboardStats' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/live-map:
    get:
      tags: [Admin Dashboard]
      summary: All active drivers and their positions
      description: Requires `tracking.view`.
      parameters:
        - $ref: '#/components/parameters/CountryQuery'
        - name: status
          in: query
          schema: { type: string, enum: [ONLINE, ON_TRIP, IDLE, ALL], default: ALL }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LiveDriver' }

  # ==========================================================================
  # ADMIN — ORDERS & DISPATCH
  # ==========================================================================

  /admin/orders:
    get:
      tags: [Admin Orders]
      summary: Search all orders
      description: Requires `order.view.all`.
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/OrderStatus' }
          style: form
          explode: false
        - $ref: '#/components/parameters/CountryQuery'
        - name: corridorId
          in: query
          schema: { type: integer, format: int64 }
        - name: clientId
          in: query
          schema: { type: integer, format: int64 }
        - name: carrierId
          in: query
          schema: { type: integer, format: int64 }
        - name: paymentMethod
          in: query
          schema: { $ref: '#/components/schemas/PaymentMethod' }
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }

  /admin/orders/{orderId}:
    get:
      tags: [Admin Orders]
      summary: Full order detail for operations
      description: Includes timeline, proofs, payments, documents, violations and audit trail.
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminOrderDetail' }

  /admin/orders/{orderId}/assign:
    post:
      tags: [Admin Orders]
      summary: Force assign a carrier
      description: Requires `order.assign`.
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrierId, reason]
              properties:
                carrierId: { type: integer, format: int64 }
                driverId: { type: integer, format: int64, nullable: true }
                vehicleId: { type: integer, format: int64, nullable: true }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '422':
          description: Carrier not eligible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/orders/{orderId}/reassign:
    post:
      tags: [Admin Orders]
      summary: Re-assign to another carrier
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrierId, reason]
              properties:
                carrierId: { type: integer, format: int64 }
                driverId: { type: integer, format: int64, nullable: true }
                vehicleId: { type: integer, format: int64, nullable: true }
                raiseViolationOnPrevious: { type: boolean, default: false }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }

  /admin/orders/{orderId}/cancel:
    post:
      tags: [Admin Orders]
      summary: Cancel an order as an operator
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, refundPolicy]
              properties:
                reason: { type: string, maxLength: 500 }
                refundPolicy:
                  type: string
                  enum: [FULL_REFUND, APPLY_FEE, NO_REFUND, CUSTOM]
                customRefundMinor: { type: integer, format: int64, nullable: true }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CancellationResult' }

  /admin/orders/{orderId}/reprice:
    post:
      tags: [Admin Orders]
      summary: Override the order price
      description: |
        Requires `order.reprice`. Creates an explicit ledger adjustment with a mandatory reason.
        The original quote snapshot is never modified.
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newTotalMinor, reason]
              properties:
                newTotalMinor: { type: integer, format: int64 }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }

  /admin/orders/{orderId}/resolve-dispute:
    post:
      tags: [Admin Orders]
      summary: Resolve a disputed order
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, note]
              properties:
                outcome:
                  type: string
                  enum: [COMPLETE_AS_IS, REFUND_CLIENT, PARTIAL_REFUND, PAY_CARRIER_ONLY, CANCEL_WITH_SETTLEMENT]
                clientRefundMinor: { type: integer, format: int64, nullable: true }
                carrierPayoutMinor: { type: integer, format: int64, nullable: true }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }

  /admin/dispatch/queue:
    get:
      tags: [Admin Orders]
      summary: Orders awaiting manual dispatch
      description: Orders that exhausted all auto-broadcast rounds, newest first.
      parameters:
        - $ref: '#/components/parameters/CountryQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DispatchQueueItem' }

  /admin/dispatch/{orderId}/candidates:
    get:
      tags: [Admin Orders]
      summary: Ranked candidate carriers with score breakdown
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DispatchCandidate' }

  /admin/dispatch/{orderId}/rebroadcast:
    post:
      tags: [Admin Orders]
      summary: Restart auto-broadcast
      parameters: [{ $ref: '#/components/parameters/OrderIdPath' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                radiusKm: { type: number, format: double, nullable: true }
                maxRounds: { type: integer, format: int32, nullable: true }
      responses:
        '202': { description: Broadcast restarted }

  # ==========================================================================
  # ADMIN — APPLICATIONS, USERS, CARRIERS, VEHICLES
  # ==========================================================================

  /admin/applications:
    get:
      tags: [Admin Applications]
      summary: Carrier application review queue
      description: Requires `carrier.approve`.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApplicationStatus' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/CarrierType' }
        - $ref: '#/components/parameters/CountryQuery'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ApplicationSummary' }

  /admin/applications/{applicationId}:
    get:
      tags: [Admin Applications]
      summary: Application detail with documents and duplicate warnings
      parameters: [{ $ref: '#/components/parameters/ApplicationIdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApplicationDetail' }

  /admin/applications/{applicationId}/approve:
    post:
      tags: [Admin Applications]
      summary: Approve an application
      description: Creates the carrier profile, wallet, portal user for companies, and default tier.
      parameters: [{ $ref: '#/components/parameters/ApplicationIdPath' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/ApplicationOk' }

  /admin/applications/{applicationId}/request-changes:
    post:
      tags: [Admin Applications]
      summary: Request changes from the applicant
      description: Reason keys are rendered in the applicant's own language.
      parameters: [{ $ref: '#/components/parameters/ApplicationIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonKeys]
              properties:
                reasonKeys:
                  type: array
                  items: { type: string, example: reason.document.unreadable }
                fieldNotes:
                  type: array
                  items: { $ref: '#/components/schemas/FieldNote' }
      responses:
        '200': { $ref: '#/components/responses/ApplicationOk' }

  /admin/applications/{applicationId}/reject:
    post:
      tags: [Admin Applications]
      summary: Reject an application
      parameters: [{ $ref: '#/components/parameters/ApplicationIdPath' }]
      requestBody:
        required: true
        content:
