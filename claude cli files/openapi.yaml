                documents:
                  type: array
                  items:
                    type: object
                    required: [docType, mandatory]
                    properties:
                      docType: { $ref: '#/components/schemas/CustomsDocumentType' }
                      mandatory: { type: boolean }
      responses:
        '200': { description: Updated }

