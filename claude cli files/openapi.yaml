      summary: Violation feed
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ViolationStatus' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/ViolationSeverity' }
        - name: subjectType
          in: query
          schema: { type: string, enum: [DRIVER, CARRIER, ORGANIZATION, CLIENT] }
        - name: subjectId
          in: query
          schema: { type: integer, format: int64 }
        - name: pendingDecisionOnly
          in: query
          description: Only violations whose auto-action requires admin confirmation.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
