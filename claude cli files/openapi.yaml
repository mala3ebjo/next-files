              properties:
                fees:
                  type: array
                  items: { $ref: '#/components/schemas/CorridorFeeBody' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CorridorFee' }

